<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>越南語拔河大賽</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:#eef3f8;
}

/* =========================
   題目設定頁
========================= */

#setupScreen{
  min-height:100vh;
  padding:30px 20px 60px;
  background:
    linear-gradient(rgba(255,255,255,.93),rgba(255,255,255,.93)),
    url("assets/background.png");
  background-size:cover;
  background-position:center;
}

.setup-container{
  width:min(1000px,96%);
  margin:auto;
}

.setup-header{
  text-align:center;
  margin-bottom:25px;
}

.setup-header h1{
  font-size:clamp(30px,4vw,55px);
  color:#202124;
  margin-bottom:8px;
}

.setup-header p{
  color:#666;
  font-size:18px;
}

.question-card{
  background:#fff;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
  border:2px solid #edf0f5;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.card-title{
  font-size:21px;
  font-weight:900;
  color:#333;
}

.delete-btn{
  border:none;
  background:#ffe6e8;
  color:#c52d3a;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
  font-size:15px;
}

.field-label{
  display:block;
  font-weight:800;
  margin:10px 0 6px;
  color:#444;
}

.question-input,
.answer-input{
  width:100%;
  border:2px solid #dce2ea;
  border-radius:12px;
  padding:12px 14px;
  font-size:17px;
  outline:none;
  transition:.2s;
}

.question-input:focus,
.answer-input:focus{
  border-color:#427ee9;
}

.answers-editor{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.answer-row{
  display:flex;
  align-items:center;
  gap:9px;
}

.answer-letter{
  width:35px;
  height:35px;
  flex:0 0 35px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  font-weight:900;
  color:#fff;
  background:#667085;
}

.answer-row input[type="radio"]{
  width:21px;
  height:21px;
  cursor:pointer;
  accent-color:#20a45a;
}

.correct-tip{
  margin-top:14px;
  color:#18864a;
  font-weight:700;
  font-size:14px;
}

.setup-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:22px;
}

.add-btn,
.start-btn,
.clear-btn{
  border:none;
  border-radius:30px;
  padding:14px 27px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.add-btn{
  background:#fff;
  color:#3371d6;
  border:2px solid #3371d6;
}

.start-btn{
  background:linear-gradient(135deg,#ef3c48,#ff7b32);
  color:#fff;
  box-shadow:0 5px 15px rgba(239,60,72,.25);
}

.clear-btn{
  background:#eef1f5;
  color:#666;
}

.add-btn:hover,
.start-btn:hover,
.clear-btn:hover{
  transform:translateY(-2px);
}

.setup-info{
  margin:25px auto 0;
  background:#fff;
  border-radius:18px;
  padding:15px 20px;
  text-align:center;
  color:#666;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.setup-info strong{
  color:#ef3340;
}

/* =========================
   遊戲
========================= */

#gameScreen{
  display:none;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#game{
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-rows:18% 49% 33%;
  background:#fff;
}

.question-area{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:10px 150px;
  background:#fff;
  z-index:10;
}

.game-title{
  font-size:clamp(13px,1.2vw,20px);
  letter-spacing:2px;
  color:#777;
  margin-bottom:7px;
}

.question{
  font-size:clamp(27px,3vw,52px);
  font-weight:900;
  text-align:center;
  color:#202124;
  line-height:1.15;
}

.timer{
  position:absolute;
  right:5%;
  top:50%;
  transform:translateY(-50%);
  width:82px;
  height:82px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ef3340;
  color:#fff;
  font-size:36px;
  font-weight:900;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.timer.danger{
  animation:timerPulse .6s infinite alternate;
}

@keyframes timerPulse{
  from{transform:translateY(-50%) scale(1);}
  to{transform:translateY(-50%) scale(1.12);}
}

.progress{
  position:absolute;
  left:4%;
  top:50%;
  transform:translateY(-50%);
  color:#777;
  font-size:18px;
  font-weight:700;
}

.top-controls{
  position:absolute;
  right:1.5%;
  top:8px;
  display:flex;
  gap:8px;
  z-index:30;
}

.sound-btn{
  width:44px;
  height:44px;
  border:none;
  border-radius:50%;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  font-size:21px;
  cursor:pointer;
}

.stop-btn{
  border:none;
  border-radius:22px;
  padding:0 15px;
  height:44px;
  background:#333;
  color:#fff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.arena{
  position:relative;
  overflow:hidden;
  background-image:url("assets/background.png");
  background-size:cover;
  background-position:center;
}

.center-line{
  position:absolute;
  left:50%;
  bottom:0;
  height:52%;
  width:5px;
  background:rgba(255,255,255,.92);
  transform:translateX(-50%);
  z-index:2;
}

.center-line::after{
  content:"";
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
}

.tug-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:5;
  pointer-events:none;
}

.tug-image{
  width:96%;
  height:auto;
  max-height:88%;
  object-fit:contain;
  object-position:center bottom;
  transform:translateX(0);
  transition:transform .55s cubic-bezier(.22,1,.36,1);
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.16));
}

.tug-image.pull-left{
  animation:pullLeft .5s ease;
}

.tug-image.pull-right{
  animation:pullRight .5s ease;
}

@keyframes pullLeft{
  0%{transform:translateX(var(--x));}
  40%{transform:translateX(calc(var(--x) - 18px));}
  100%{transform:translateX(var(--x));}
}

@keyframes pullRight{
  0%{transform:translateX(var(--x));}
  40%{transform:translateX(calc(var(--x) + 18px));}
  100%{transform:translateX(var(--x));}
}

.team-label{
  position:absolute;
  bottom:4%;
  padding:9px 25px;
  color:#fff;
  border-radius:30px;
  font-weight:900;
  font-size:clamp(14px,1.5vw,25px);
  z-index:8;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.red-label{
  left:3%;
  background:#e93443;
}

.blue-label{
  right:3%;
  background:#287ce0;
}

.status{
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  background:rgba(255,255,255,.96);
  padding:8px 20px;
  border-radius:30px;
  font-size:18px;
  font-weight:900;
  box-shadow:0 3px 12px rgba(0,0,0,.14);
  opacity:0;
  transition:.25s;
}

.status.show{
  opacity:1;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f5f7fb;
  min-height:0;
}

.team-panel{
  padding:10px 20px 14px;
  min-width:0;
}

.red-panel{
  border-right:2px solid #dfe5ed;
}

.panel-title{
  text-align:center;
  font-size:clamp(17px,1.8vw,29px);
  font-weight:900;
  margin-bottom:8px;
}

.red-panel .panel-title{
  color:#d93242;
}

.blue-panel .panel-title{
  color:#2878d4;
}

.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.answer-btn{
  min-height:58px;
  border-radius:15px;
  background:#fff;
  font-size:clamp(14px,1.35vw,22px);
  font-weight:800;
  cursor:pointer;
  transition:.18s;
  padding:8px 12px;
}

.red-panel .answer-btn{
  border:3px solid #f3a4aa;
  color:#bb3440;
}

.blue-panel .answer-btn{
  border:3px solid #92bff1;
  color:#2674c8;
}

.answer-btn:hover{
  transform:translateY(-2px);
}

.answer-btn:active{
  transform:scale(.97);
}

.answer-btn.selected{
  background:#fff2a8 !important;
  border-color:#f1b900 !important;
  color:#222 !important;
}

.answer-btn.correct{
  background:#dff7e5 !important;
  border-color:#38ad61 !important;
  color:#177438 !important;
}

.answer-btn.wrong{
  background:#ffe2e4 !important;
  border-color:#ef5963 !important;
  color:#b5222d !important;
}

.answer-btn:disabled{
  cursor:default;
}

/* =========================
   勝利
========================= */

#winnerScreen{
  position:fixed;
  inset:0;
  background:rgba(10,20,35,.88);
  z-index:100;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:#fff;
  text-align:center;
}

#winnerScreen.show{
  display:flex;
}

#winnerEmoji{
  font-size:100px;
}

#winnerText{
  font-size:clamp(40px,6vw,90px);
  font-weight:900;
  margin:15px;
}

.winner-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.restart,
.edit-questions{
  border:none;
  padding:15px 30px;
  border-radius:30px;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}

.restart{
  background:#fff;
  color:#222;
}

.edit-questions{
  background:#ffd84d;
  color:#333;
}

/* =========================
   停止確認
========================= */

#stopModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
  display:none;
  justify-content:center;
  align-items:center;
}

#stopModal.show{
  display:flex;
}

.stop-box{
  width:min(440px,90%);
  background:#fff;
  padding:30px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.stop-box h2{
  font-size:26px;
  margin-bottom:10px;
}

.stop-box p{
  color:#666;
  margin-bottom:22px;
}

.stop-actions{
  display:flex;
  justify-content:center;
  gap:12px;
}

.continue-btn,
.end-btn{
  border:none;
  padding:12px 20px;
  border-radius:25px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.continue-btn{
  background:#e9edf3;
  color:#333;
}

.end-btn{
  background:#e93443;
  color:#fff;
}

@media(max-width:800px){

  #game{
    grid-template-rows:18% 44% 38%;
  }

  .question-area{
    padding:10px 75px;
  }

  .timer{
    width:58px;
    height:58px;
    font-size:25px;
  }

  .progress{
    display:none;
  }

  .answers-editor{
    grid-template-columns:1fr;
  }

  .team-panel{
    padding:8px;
  }

  .answer-grid{
    gap:5px;
  }

  .answer-btn{
    min-height:48px;
  }

  .tug-image{
    width:98%;
    max-height:90%;
  }

  .stop-btn{
    padding:0 9px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- =========================
     老師出題頁
========================= -->

<section id="setupScreen">

  <div class="setup-container">

    <div class="setup-header">
      <h1>🇻🇳 越南語拔河大賽</h1>
      <p>輸入今天要讓學生挑戰的題目</p>
    </div>

    <div id="questionEditor"></div>

    <div class="setup-actions">

      <button class="add-btn" id="addQuestionBtn">
        ＋ 新增題目
      </button>

      <button class="clear-btn" id="clearQuestionsBtn">
        🗑️ 清空題目
      </button>

      <button class="start-btn" id="startGameBtn">
        🔥 開始拔河！
      </button>

    </div>

    <div class="setup-info">
      ⏱️ 每題 <strong>10 秒</strong>
      ・
      🏆 先拉動 <strong>5 次</strong> 的隊伍獲勝
      ・
      💾 題目會自動保存在這台電腦
    </div>

  </div>

</section>


<!-- =========================
     遊戲頁
========================= -->

<section id="gameScreen">

<div id="game">

  <header class="question-area">

    <div class="progress" id="progress"></div>

    <div class="game-title">
      🇻🇳 VIETNAMESE TUG OF WAR
    </div>

    <div class="question" id="question"></div>

    <div class="timer" id="timer">10</div>

    <div class="top-controls">

      <button
        class="sound-btn"
        id="soundBtn"
        title="音效開關">
        🔊
      </button>

      <button
        class="stop-btn"
        id="stopBtn">
        ⏹ 停止遊戲
      </button>

    </div>

  </header>


  <main class="arena">

    <div class="center-line"></div>

    <div class="status" id="status"></div>

    <div class="tug-wrap">

      <img
        src="assets/tug-war.png"
        class="tug-image"
        id="tugImage"
        alt="Vietnamese Tug of War">

    </div>

    <div class="team-label red-label">
      🔴 ĐỘI ĐỎ
    </div>

    <div class="team-label blue-label">
      ĐỘI XANH 🔵
    </div>

  </main>


  <section class="answers">

    <div class="team-panel red-panel">

      <div class="panel-title">
        🔴 ĐỘI ĐỎ
      </div>

      <div
        class="answer-grid"
        id="redAnswers">
      </div>

    </div>


    <div class="team-panel blue-panel">

      <div class="panel-title">
        🔵 ĐỘI XANH
      </div>

      <div
        class="answer-grid"
        id="blueAnswers">
      </div>

    </div>

  </section>

</div>

</section>


<!-- =========================
     勝利畫面
========================= -->

<div id="winnerScreen">

  <div id="winnerEmoji">
    🏆
  </div>

  <div id="winnerText"></div>

  <div class="winner-buttons">

    <button
      class="restart"
      id="restartBtn">
      🔥 再玩一次
    </button>

    <button
      class="edit-questions"
      id="editQuestionsBtn">
      ✏️ 編輯題目
    </button>

  </div>

</div>


<!-- =========================
     停止確認
========================= -->

<div id="stopModal">

  <div class="stop-box">

    <h2>⏹ 停止遊戲？</h2>

    <p>
      題目會保留，不會被刪除。
    </p>

    <div class="stop-actions">

      <button
        class="continue-btn"
        id="continueBtn">
        🔙 繼續比賽
      </button>

      <button
        class="end-btn"
        id="endGameBtn">
        ⏹ 結束遊戲
      </button>

    </div>

  </div>

</div>


<!-- =========================
     音樂
========================= -->

<audio
  id="bgm"
  src="assets/bgm.mp3"
  loop>
</audio>

<audio
  id="countdownSound"
  src="assets/countdown.mp3">
</audio>

<audio
  id="correctSound"
  src="assets/correct.mp3">
</audio>

<audio
  id="wrongSound"
  src="assets/wrong.mp3">
</audio>

<audio
  id="winSound"
  src="assets/win.mp3">
</audio>


<script>

/* =========================
   基本設定
========================= */

const QUESTION_TIME = 10;
const WIN_SCORE = 5;
const STEP = 2.8;

let questions = [];

let currentQuestion = 0;
let ropePosition = 0;

let redAnswer = null;
let blueAnswer = null;

let redTime = null;
let blueTime = null;

let questionStartTime = null;

let timeLeft = QUESTION_TIME;
let timerInterval = null;

let roundFinished = false;

let soundEnabled = true;
let audioStarted = false;

let gamePaused = false;


/* =========================
   DOM
========================= */

const setupScreen =
document.getElementById("setupScreen");

const gameScreen =
document.getElementById("gameScreen");

const questionEditor =
document.getElementById("questionEditor");

const addQuestionBtn =
document.getElementById("addQuestionBtn");

const clearQuestionsBtn =
document.getElementById("clearQuestionsBtn");

const startGameBtn =
document.getElementById("startGameBtn");

const questionEl =
document.getElementById("question");

const progressEl =
document.getElementById("progress");

const timerEl =
document.getElementById("timer");

const redAnswersEl =
document.getElementById("redAnswers");

const blueAnswersEl =
document.getElementById("blueAnswers");

const tugImage =
document.getElementById("tugImage");

const statusEl =
document.getElementById("status");

const winnerScreen =
document.getElementById("winnerScreen");

const winnerText =
document.getElementById("winnerText");

const restartBtn =
document.getElementById("restartBtn");

const editQuestionsBtn =
document.getElementById("editQuestionsBtn");

const soundBtn =
document.getElementById("soundBtn");

const stopBtn =
document.getElementById("stopBtn");

const stopModal =
document.getElementById("stopModal");

const continueBtn =
document.getElementById("continueBtn");

const endGameBtn =
document.getElementById("endGameBtn");


/* =========================
   音樂
========================= */

const bgm =
document.getElementById("bgm");

const countdownSound =
document.getElementById("countdownSound");

const correctSound =
document.getElementById("correctSound");

const wrongSound =
document.getElementById("wrongSound");

const winSound =
document.getElementById("winSound");


bgm.volume = 0.26;
countdownSound.volume = 0.65;
correctSound.volume = 0.75;
wrongSound.volume = 0.75;
winSound.volume = 0.9;


function stopAllSounds(){

  bgm.pause();

  countdownSound.pause();
  correctSound.pause();
  wrongSound.pause();
  winSound.pause();

  bgm.currentTime = 0;
  countdownSound.currentTime = 0;
  correctSound.currentTime = 0;
  wrongSound.currentTime = 0;
  winSound.currentTime = 0;

}


function playSound(audio){

  if(!soundEnabled) return;

  audio.currentTime = 0;

  audio.play().catch(()=>{});

}


function startBGM(){

  if(!soundEnabled) return;

  audioStarted = true;

  bgm.play().catch(()=>{});

}


soundBtn.addEventListener("click",()=>{

  soundEnabled = !soundEnabled;

  if(soundEnabled){

    soundBtn.textContent = "🔊";

    if(
      gameScreen.style.display === "block" &&
      !gamePaused &&
      !winnerScreen.classList.contains("show")
    ){
      bgm.play().catch(()=>{});
    }

  }else{

    soundBtn.textContent = "🔇";

    bgm.pause();
    countdownSound.pause();
    correctSound.pause();
    wrongSound.pause();
    winSound.pause();

  }

});


/* =========================
   題目資料
========================= */

function createBlankQuestion(){

  return {
    question:"",
    answers:["","","",""],
    correct:0
  };

}


function loadSavedQuestions(){

  const saved =
  localStorage.getItem("vietnameseTugQuestions");

  if(saved){

    try{

      const data = JSON.parse(saved);

      if(
        Array.isArray(data) &&
        data.length > 0
      ){
        questions = data;
        return;
      }

    }catch(error){}

  }

  /* 第一次開啟時給一題範例 */

  questions = [
    {
      question:"Bạn tên là gì?",
      answers:[
        "你幾歲？",
        "你叫什麼名字？",
        "你住在哪裡？",
        "你喜歡什麼？"
      ],
      correct:1
    }
  ];

}


function saveQuestions(){

  localStorage.setItem(
    "vietnameseTugQuestions",
    JSON.stringify(questions)
  );

}


/* =========================
   題目編輯器
========================= */

function renderEditor(){

  questionEditor.innerHTML = "";

  questions.forEach((q,index)=>{

    const card =
    document.createElement("div");

    card.className = "question-card";

    const letters =
    ["A","B","C","D"];

    card.innerHTML = `

      <div class="card-top">

        <div class="card-title">
          題目 ${index + 1}
        </div>

        ${
          questions.length > 1
          ?
          `<button
            class="delete-btn"
            data-delete="${index}">
            🗑️ 刪除
          </button>`
          :
          ""
        }

      </div>

      <label class="field-label">
        題目
      </label>

      <input
        class="question-input"
        data-question="${index}"
        value="${escapeHTML(q.question)}"
        placeholder="例如：Bạn tên là gì?">

      <label class="field-label">
        選項
      </label>

      <div class="answers-editor">

        ${q.answers.map((answer,aIndex)=>`

          <div class="answer-row">

            <div class="answer-letter">
              ${letters[aIndex]}
            </div>

            <input
              type="text"
              class="answer-input"
              data-answer-question="${index}"
              data-answer-index="${aIndex}"
              value="${escapeHTML(answer)}"
              placeholder="輸入選項 ${letters[aIndex]}">

            <input
              type="radio"
              name="correct-${index}"
              data-correct-question="${index}"
              data-correct-index="${aIndex}"
              ${q.correct === aIndex ? "checked" : ""}
              title="設為正確答案">

          </div>

        `).join("")}

      </div>

      <div class="correct-tip">
        ✓ 點選選項右邊的圓圈，設定正確答案
      </div>

    `;

    questionEditor.appendChild(card);

  });


  bindEditorEvents();

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


function bindEditorEvents(){

  document
  .querySelectorAll("[data-question]")
  .forEach(input=>{

    input.addEventListener("input",()=>{

      const index =
      Number(input.dataset.question);

      questions[index].question =
      input.value;

      saveQuestions();

    });

  });


  document
  .querySelectorAll("[data-answer-question]")
  .forEach(input=>{

    input.addEventListener("input",()=>{

      const qIndex =
      Number(input.dataset.answerQuestion);

      const aIndex =
      Number(input.dataset.answerIndex);

      questions[qIndex]
      .answers[aIndex] =
      input.value;

      saveQuestions();

    });

  });


  document
  .querySelectorAll("[data-correct-question]")
  .forEach(radio=>{

    radio.addEventListener("change",()=>{

      const qIndex =
      Number(radio.dataset.correctQuestion);

      const aIndex =
      Number(radio.dataset.correctIndex);

      questions[qIndex].correct =
      aIndex;

      saveQuestions();

    });

  });


  document
  .querySelectorAll("[data-delete]")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      const index =
      Number(button.dataset.delete);

      questions.splice(index,1);

      saveQuestions();
      renderEditor();

    });

  });

}


addQuestionBtn.addEventListener("click",()=>{

  questions.push(
    createBlankQuestion()
  );

  saveQuestions();
  renderEditor();

  setTimeout(()=>{

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  },100);

});


clearQuestionsBtn.addEventListener("click",()=>{

  const ok =
  confirm("確定要清空所有題目嗎？");

  if(!ok) return;

  questions = [
    createBlankQuestion()
  ];

  saveQuestions();
  renderEditor();

});


/* =========================
   開始遊戲
========================= */

startGameBtn.addEventListener("click",()=>{

  const valid =
  validateQuestions();

  if(!valid) return;

  saveQuestions();

  currentQuestion = 0;
  ropePosition = 0;

  gamePaused = false;
  roundFinished = false;

  tugImage.style.setProperty(
    "--x",
    "0vw"
  );

  tugImage.style.transform =
  "translateX(0)";

  stopAllSounds();

  setupScreen.style.display =
  "none";

  gameScreen.style.display =
  "block";

  document.body.style.overflow =
  "hidden";

  /* 老師按「開始拔河」就是使用者操作，
     因此這裡可以開始播放 BGM */

  startBGM();

  loadQuestion();

});


function validateQuestions(){

  if(questions.length === 0){

    alert("請至少新增一題。");
    return false;

  }

  for(
    let i=0;
    i<questions.length;
    i++
  ){

    const q = questions[i];

    if(!q.question.trim()){

      alert(
        `第 ${i+1} 題還沒有輸入題目。`
      );

      return false;

    }

    for(
      let a=0;
      a<4;
      a++
    ){

      if(
        !q.answers[a] ||
        !q.answers[a].trim()
      ){

        alert(
          `第 ${i+1} 題的選項 ${["A","B","C","D"][a]} 還沒有填寫。`
        );

        return false;

      }

    }

  }

  return true;

}


/* =========================
   載入題目
========================= */

function loadQuestion(){

  clearInterval(timerInterval);

  countdownSound.pause();
  countdownSound.currentTime = 0;

  roundFinished = false;

  redAnswer = null;
  blueAnswer = null;

  redTime = null;
  blueTime = null;

  timeLeft = QUESTION_TIME;

  const q =
  questions[currentQuestion];

  questionEl.textContent =
  q.question;

  progressEl.textContent =
  `Câu ${currentQuestion + 1}/${questions.length}`;

  timerEl.textContent =
  timeLeft;

  timerEl.style.background =
  "#ef3340";

  timerEl.classList.remove(
    "danger"
  );

  createAnswers(
    redAnswersEl,
    "red",
    q
  );

  createAnswers(
    blueAnswersEl,
    "blue",
    q
  );

  questionStartTime =
  performance.now();

  startTimer();

}


/* =========================
   計時器
========================= */

function startTimer(){

  clearInterval(timerInterval);

  timerInterval =
  setInterval(()=>{

    if(gamePaused) return;

    timeLeft--;

    timerEl.textContent =
    timeLeft;

    if(timeLeft <= 5){

      timerEl.style.background =
      "#ff6500";

      timerEl.classList.add(
        "danger"
      );

    }else{

      timerEl.style.background =
      "#ef3340";

    }

    if(timeLeft === 5){

      playSound(
        countdownSound
      );

    }

    if(timeLeft <= 0){

      clearInterval(
        timerInterval
      );

      finishRound();

    }

  },1000);

}


/* =========================
   建立答案
========================= */

function createAnswers(
  container,
  team,
  q
){

  container.innerHTML = "";

  const letters =
  ["A","B","C","D"];

  q.answers.forEach(
    (answer,index)=>{

      const button =
      document.createElement(
        "button"
      );

      button.className =
      "answer-btn";

      button.innerHTML =
      `<strong>${letters[index]}.</strong> ${escapeHTML(answer)}`;

      button.addEventListener(
        "click",
        ()=>chooseAnswer(
          team,
          index,
          button
        )
      );

      container.appendChild(
        button
      );

    }
  );

}


/* =========================
   作答
========================= */

function chooseAnswer(
  team,
  index,
  button
){

  if(
    roundFinished ||
    gamePaused
  ) return;

  if(!audioStarted){
    startBGM();
  }

  const answerTime =
  performance.now() -
  questionStartTime;

  if(team === "red"){

    if(
      redAnswer !== null
    ) return;

    redAnswer = index;
    redTime = answerTime;

    lockTeam(
      redAnswersEl
    );

    button.classList.add(
      "selected"
    );

  }


  if(team === "blue"){

    if(
      blueAnswer !== null
    ) return;

    blueAnswer = index;
    blueTime = answerTime;

    lockTeam(
      blueAnswersEl
    );

    button.classList.add(
      "selected"
    );

  }


  if(
    redAnswer !== null &&
    blueAnswer !== null
  ){

    finishRound();

  }

}


function lockTeam(container){

  container
  .querySelectorAll("button")
  .forEach(btn=>{

    btn.disabled = true;

  });

}


/* =========================
   回合判定
========================= */

function finishRound(){

  if(roundFinished) return;

  roundFinished = true;

  clearInterval(
    timerInterval
  );

  countdownSound.pause();
  countdownSound.currentTime = 0;

  timerEl.classList.remove(
    "danger"
  );

  const q =
  questions[currentQuestion];

  revealAnswers(
    q.correct
  );

  const redCorrect =
  redAnswer === q.correct;

  const blueCorrect =
  blueAnswer === q.correct;


  if(
    redCorrect &&
    !blueCorrect
  ){

    playSound(
      correctSound
    );

    showStatus(
      "🔴 ĐỘI ĐỎ KÉO!"
    );

    moveTug(-1);

  }

  else if(
    blueCorrect &&
    !redCorrect
  ){

    playSound(
      correctSound
    );

    showStatus(
      "ĐỘI XANH KÉO! 🔵"
    );

    moveTug(1);

  }

  else if(
    redCorrect &&
    blueCorrect
  ){

    playSound(
      correctSound
    );

    const difference =
    Math.abs(
      redTime - blueTime
    );

    if(difference < 50){

      showStatus(
        "⚡ HÒA!"
      );

    }

    else if(
      redTime < blueTime
    ){

      showStatus(
        "⚡ ĐỘI ĐỎ NHANH HƠN!"
      );

      moveTug(-1);

    }

    else{

      showStatus(
        "⚡ ĐỘI XANH NHANH HƠN!"
      );

      moveTug(1);

    }

  }

  else{

    playSound(
      wrongSound
    );

    showStatus(
      "😅 KHÔNG ĐỘI NÀO KÉO!"
    );

  }


  if(
    ropePosition <=
    -WIN_SCORE
  ){

    setTimeout(
      ()=>showWinner("red"),
      900
    );

    return;

  }


  if(
    ropePosition >=
    WIN_SCORE
  ){

    setTimeout(
      ()=>showWinner("blue"),
      900
    );

    return;

  }


  setTimeout(()=>{

    if(gamePaused) return;

    currentQuestion++;

    if(
      currentQuestion >=
      questions.length
    ){

      currentQuestion = 0;

    }

    loadQuestion();

  },2200);

}


/* =========================
   顯示答案
========================= */

function revealAnswers(correct){

  [
    redAnswersEl,
    blueAnswersEl
  ].forEach(container=>{

    const buttons =
    container.querySelectorAll(
      "button"
    );

    buttons.forEach(
      (button,index)=>{

        button.disabled = true;

        if(
          index === correct
        ){

          button.classList.add(
            "correct"
          );

        }

      }
    );

  });


  if(
    redAnswer !== null &&
    redAnswer !== correct
  ){

    redAnswersEl
    .children[redAnswer]
    .classList.add(
      "wrong"
    );

  }


  if(
    blueAnswer !== null &&
    blueAnswer !== correct
  ){

    blueAnswersEl
    .children[blueAnswer]
    .classList.add(
      "wrong"
    );

  }

}


/* =========================
   拔河
========================= */

function moveTug(direction){

  ropePosition += direction;

  const position =
  ropePosition * STEP;

  tugImage.style.setProperty(
    "--x",
    position + "vw"
  );

  tugImage.style.transform =
  `translateX(${position}vw)`;


  tugImage.classList.remove(
    "pull-left",
    "pull-right"
  );

  void tugImage.offsetWidth;


  if(direction < 0){

    tugImage.classList.add(
      "pull-left"
    );

  }else{

    tugImage.classList.add(
      "pull-right"
    );

  }

}


/* =========================
   狀態
========================= */

function showStatus(text){

  statusEl.textContent =
  text;

  statusEl.classList.add(
    "show"
  );

  setTimeout(()=>{

    statusEl.classList.remove(
      "show"
    );

  },1700);

}


/* =========================
   勝利
========================= */

function showWinner(team){

  clearInterval(
    timerInterval
  );

  bgm.pause();
  bgm.currentTime = 0;

  countdownSound.pause();
  countdownSound.currentTime = 0;

  correctSound.pause();
  correctSound.currentTime = 0;

  wrongSound.pause();
  wrongSound.currentTime = 0;

  playSound(
    winSound
  );

  winnerScreen.classList.add(
    "show"
  );

  if(team === "red"){

    winnerText.textContent =
    "🔴 ĐỘI ĐỎ THẮNG!";

  }else{

    winnerText.textContent =
    "ĐỘI XANH THẮNG! 🔵";

  }

}


/* =========================
   再玩一次
========================= */

function restartGame(){

  stopAllSounds();

  clearInterval(
    timerInterval
  );

  currentQuestion = 0;
  ropePosition = 0;

  redAnswer = null;
  blueAnswer = null;

  gamePaused = false;
  roundFinished = false;

  tugImage.style.setProperty(
    "--x",
    "0vw"
  );

  tugImage.style.transform =
  "translateX(0)";

  winnerScreen.classList.remove(
    "show"
  );

  if(soundEnabled){

    bgm.play().catch(()=>{});

  }

  loadQuestion();

}


restartBtn.addEventListener(
  "click",
  restartGame
);


/* =========================
   編輯題目
========================= */

editQuestionsBtn.addEventListener(
  "click",
  ()=>{

    winnerScreen.classList.remove(
      "show"
    );

    returnToSetup();

  }
);


/* =========================
   停止遊戲
========================= */

stopBtn.addEventListener(
  "click",
  ()=>{

    gamePaused = true;

    clearInterval(
      timerInterval
    );

    bgm.pause();

    countdownSound.pause();

    stopModal.classList.add(
      "show"
    );

  }
);


/* 繼續 */

continueBtn.addEventListener(
  "click",
  ()=>{

    stopModal.classList.remove(
      "show"
    );

    gamePaused = false;

    if(soundEnabled){

      bgm.play().catch(()=>{});

    }

    startTimer();

  }
);


/* 真正結束 */

endGameBtn.addEventListener(
  "click",
  ()=>{

    stopModal.classList.remove(
      "show"
    );

    returnToSetup();

  }
);


function returnToSetup(){

  clearInterval(
    timerInterval
  );

  stopAllSounds();

  gamePaused = false;
  roundFinished = false;

  currentQuestion = 0;
  ropePosition = 0;

  tugImage.style.setProperty(
    "--x",
    "0vw"
  );

  tugImage.style.transform =
  "translateX(0)";

  winnerScreen.classList.remove(
    "show"
  );

  gameScreen.style.display =
  "none";

  setupScreen.style.display =
  "block";

  document.body.style.overflow =
  "auto";

  renderEditor();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   啟動
========================= */

loadSavedQuestions();

renderEditor();

tugImage.style.setProperty(
  "--x",
  "0vw"
);

</script>

</body>
</html>
