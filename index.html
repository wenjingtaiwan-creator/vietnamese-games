<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>越南語拔河大賽</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:#eef3f8;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* =========================
   整個遊戲
========================= */

#game{
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-rows:18% 49% 33%;
  background:white;
}

/* =========================
   題目區
========================= */

.question-area{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:10px 120px;
  background:#fff;
  z-index:10;
}

.game-title{
  font-size:clamp(13px,1.2vw,20px);
  letter-spacing:2px;
  color:#777;
  margin-bottom:7px;
}

.question{
  font-size:clamp(27px,3vw,52px);
  font-weight:900;
  text-align:center;
  color:#202124;
  line-height:1.15;
}

.timer{
  position:absolute;
  right:5%;
  top:50%;
  transform:translateY(-50%);
  width:82px;
  height:82px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ef3340;
  color:white;
  font-size:36px;
  font-weight:900;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.progress{
  position:absolute;
  left:4%;
  top:50%;
  transform:translateY(-50%);
  color:#777;
  font-size:18px;
  font-weight:700;
}

/* =========================
   拔河場景
========================= */

.arena{
  position:relative;
  overflow:hidden;
  background-image:url("assets/background.png");
  background-size:cover;
  background-position:center;
}

/* 中央勝負線 */

.center-line{
  position:absolute;
  left:50%;
  bottom:0;
  height:50%;
  width:5px;
  background:rgba(255,255,255,.9);
  transform:translateX(-50%);
  z-index:2;
}

.center-line::after{
  content:"";
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
}

/* =========================
   拔河系統
========================= */

.tug-system{
  position:absolute;
  inset:0;
  transition:transform .75s cubic-bezier(.22,1.35,.36,1);
}

/* 紅隊 */

.red-team{
  position:absolute;
  width:34%;
  max-height:76%;
  object-fit:contain;

  left:3%;
  bottom:7%;

  z-index:4;

  filter:drop-shadow(0 6px 5px rgba(0,0,0,.18));
}

/* 藍隊 */

.blue-team{
  position:absolute;
  width:34%;
  max-height:76%;
  object-fit:contain;

  right:3%;
  bottom:7%;

  z-index:4;

  filter:drop-shadow(0 6px 5px rgba(0,0,0,.18));
}

/* 繩子 */

.rope{
  position:absolute;
  width:82%;
  height:auto;
  left:9%;
  top:68%;
  transform:translateY(-50%);
  z-index:5;
  pointer-events:none;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));
}
/* =========================
   隊伍名稱
========================= */

.team-label{
  position:absolute;
  bottom:4%;
  padding:9px 25px;
  color:white;
  border-radius:30px;
  font-weight:900;
  font-size:clamp(14px,1.5vw,25px);
  z-index:8;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.red-label{
  left:3%;
  background:#e93443;
}

.blue-label{
  right:3%;
  background:#287ce0;
}

/* =========================
   拉動動畫
========================= */

.pull-red{
  animation:redPull .7s ease;
}

.pull-blue{
  animation:bluePull .7s ease;
}

@keyframes redPull{
  0%{transform:translateX(var(--rope-x));}
  35%{transform:translateX(calc(var(--rope-x) - 20px));}
  60%{transform:translateX(calc(var(--rope-x) + 7px));}
  100%{transform:translateX(var(--rope-x));}
}

@keyframes bluePull{
  0%{transform:translateX(var(--rope-x));}
  35%{transform:translateX(calc(var(--rope-x) + 20px));}
  60%{transform:translateX(calc(var(--rope-x) - 7px));}
  100%{transform:translateX(var(--rope-x));}
}

/* =========================
   答題區
========================= */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f5f7fb;
  min-height:0;
}

.team-panel{
  padding:10px 20px 14px;
  min-width:0;
}

.red-panel{
  border-right:2px solid #dfe5ed;
}

.panel-title{
  text-align:center;
  font-size:clamp(17px,1.8vw,29px);
  font-weight:900;
  margin-bottom:8px;
}

.red-panel .panel-title{
  color:#d93242;
}

.blue-panel .panel-title{
  color:#2878d4;
}

.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.answer-btn{
  min-height:58px;
  border-radius:15px;
  background:white;
  font-size:clamp(14px,1.35vw,22px);
  font-weight:800;
  cursor:pointer;
  transition:.18s;
  padding:8px 12px;
}

.red-panel .answer-btn{
  border:3px solid #f3a4aa;
  color:#bb3440;
}

.blue-panel .answer-btn{
  border:3px solid #92bff1;
  color:#2674c8;
}

.answer-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 12px rgba(0,0,0,.12);
}

.answer-btn:active{
  transform:scale(.97);
}

.answer-btn.selected{
  background:#fff2a8 !important;
  border-color:#f1b900 !important;
  color:#222 !important;
}

.answer-btn.correct{
  background:#dff7e5 !important;
  border-color:#38ad61 !important;
  color:#177438 !important;
}

.answer-btn.wrong{
  background:#ffe2e4 !important;
  border-color:#ef5963 !important;
  color:#b5222d !important;
}

.answer-btn:disabled{
  cursor:default;
}

/* =========================
   狀態訊息
========================= */

.status{
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  z-index:20;

  background:rgba(255,255,255,.93);
  padding:8px 20px;
  border-radius:30px;

  font-size:18px;
  font-weight:900;

  box-shadow:0 3px 12px rgba(0,0,0,.14);

  opacity:0;
  transition:.25s;
}

.status.show{
  opacity:1;
}

/* =========================
   勝利畫面
========================= */

#winnerScreen{
  position:fixed;
  inset:0;
  background:rgba(10,20,35,.82);
  z-index:100;

  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  color:white;
  text-align:center;
}

#winnerScreen.show{
  display:flex;
  animation:fadeIn .35s ease;
}

#winnerEmoji{
  font-size:100px;
  animation:bounce 1s infinite;
}

#winnerText{
  font-size:clamp(40px,6vw,90px);
  font-weight:1000;
  margin:15px;
}

.restart{
  border:none;
  background:white;
  padding:15px 35px;
  border-radius:30px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-18px);}
}

/* 小螢幕 */

@media(max-width:800px){

  #game{
    grid-template-rows:18% 44% 38%;
  }

  .question-area{
    padding:10px 80px;
  }

  .timer{
    width:58px;
    height:58px;
    font-size:25px;
  }

  .progress{
    display:none;
  }

  .team-panel{
    padding:8px;
  }

  .answer-grid{
    gap:5px;
  }

  .answer-btn{
    min-height:48px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- 題目 -->

  <header class="question-area">

    <div class="progress" id="progress">
      Câu 1/6
    </div>

    <div class="game-title">
      🇻🇳 VIETNAMESE TUG OF WAR
    </div>

    <div class="question" id="question">
      Bạn tên là gì?
    </div>

    <div class="timer" id="timer">
      20
    </div>

  </header>


  <!-- 遊戲場景 -->

  <main class="arena">

    <div class="center-line"></div>

    <div class="status" id="status">
      Chuẩn bị!
    </div>

    <div class="tug-system" id="tugSystem">

      <img
        src="assets/red-team.png"
        class="red-team"
        alt="Red Team"
      >

      <img
        src="assets/rope.png"
        class="rope"
        alt="Tug of war rope"
      >

      <img
        src="assets/blue-team.png"
        class="blue-team"
        alt="Blue Team"
      >

    </div>

    <div class="team-label red-label">
      🔴 ĐỘI ĐỎ
    </div>

    <div class="team-label blue-label">
      ĐỘI XANH 🔵
    </div>

  </main>


  <!-- 答題 -->

  <section class="answers">

    <div class="team-panel red-panel">

      <div class="panel-title">
        🔴 ĐỘI ĐỎ
      </div>

      <div class="answer-grid" id="redAnswers"></div>

    </div>


    <div class="team-panel blue-panel">

      <div class="panel-title">
        🔵 ĐỘI XANH
      </div>

      <div class="answer-grid" id="blueAnswers"></div>

    </div>

  </section>

</div>


<!-- 勝利畫面 -->

<div id="winnerScreen">

  <div id="winnerEmoji">
    🏆
  </div>

  <div id="winnerText">
    ĐỘI ĐỎ THẮNG!
  </div>

  <button class="restart" onclick="restartGame()">
    Chơi lại
  </button>

</div>


<script>

/* =====================================================
   題庫
   之後只要修改這裡即可
===================================================== */

const questions = [

{
  question:"Bạn tên là gì?",
  answers:[
    "你幾歲？",
    "你叫什麼名字？",
    "你住在哪裡？",
    "你喜歡什麼？"
  ],
  correct:1
},

{
  question:"“Xin chào” nghĩa là gì?",
  answers:[
    "再見",
    "你好",
    "謝謝",
    "對不起"
  ],
  correct:1
},

{
  question:"“Màu đỏ” là màu gì?",
  answers:[
    "藍色",
    "黃色",
    "紅色",
    "綠色"
  ],
  correct:2
},

{
  question:"Bạn bao nhiêu tuổi?",
  answers:[
    "你幾歲？",
    "你叫什麼名字？",
    "你是哪國人？",
    "你喜歡什麼？"
  ],
  correct:0
},

{
  question:"Tôi thích nghe nhạc.",
  answers:[
    "我喜歡看書",
    "我喜歡聽音樂",
    "我喜歡運動",
    "我喜歡旅行"
  ],
  correct:1
},

{
  question:"“Cảm ơn” nghĩa là gì?",
  answers:[
    "謝謝",
    "對不起",
    "你好",
    "再見"
  ],
  correct:0
}

];


/* =====================================================
   遊戲設定
===================================================== */

const QUESTION_TIME = 20;

/*
需要拉幾格才勝利
5 = 紅隊拉到 -5 或藍隊拉到 +5
*/

const WIN_SCORE = 5;

/*
每一格移動多少
使用 vw 可以跟著螢幕大小調整
*/

const STEP = 4;


/* =====================================================
   遊戲狀態
===================================================== */

let currentQuestion = 0;

let ropePosition = 0;

let redAnswer = null;
let blueAnswer = null;

let redTime = null;
let blueTime = null;

let questionStartTime = null;

let timeLeft = QUESTION_TIME;

let timerInterval = null;

let roundFinished = false;


/* =====================================================
   DOM
===================================================== */

const questionEl =
document.getElementById("question");

const progressEl =
document.getElementById("progress");

const timerEl =
document.getElementById("timer");

const redAnswersEl =
document.getElementById("redAnswers");

const blueAnswersEl =
document.getElementById("blueAnswers");

const tugSystem =
document.getElementById("tugSystem");

const statusEl =
document.getElementById("status");

const winnerScreen =
document.getElementById("winnerScreen");

const winnerText =
document.getElementById("winnerText");


/* =====================================================
   載入題目
===================================================== */

function loadQuestion(){

  clearInterval(timerInterval);

  roundFinished=false;

  redAnswer=null;
  blueAnswer=null;

  redTime=null;
  blueTime=null;

  timeLeft=QUESTION_TIME;

  const q=questions[currentQuestion];

  questionEl.textContent=q.question;

  progressEl.textContent=
  `Câu ${currentQuestion+1}/${questions.length}`;

  timerEl.textContent=timeLeft;

  createAnswers(redAnswersEl,"red",q);
  createAnswers(blueAnswersEl,"blue",q);

  questionStartTime=performance.now();

  timerInterval=setInterval(()=>{

    timeLeft--;

    timerEl.textContent=timeLeft;

    if(timeLeft<=5){
      timerEl.style.background="#ff7a00";
    }else{
      timerEl.style.background="#ef3340";
    }

    if(timeLeft<=0){

      clearInterval(timerInterval);

      finishRound();

    }

  },1000);

}


/* =====================================================
   建立答案按鈕
===================================================== */

function createAnswers(container,team,q){

  container.innerHTML="";

  const letters=["A","B","C","D"];

  q.answers.forEach((answer,index)=>{

    const button=document.createElement("button");

    button.className="answer-btn";

    button.innerHTML=
    `<strong>${letters[index]}.</strong> ${answer}`;

    button.onclick=()=>{

      chooseAnswer(team,index,button);

    };

    container.appendChild(button);

  });

}


/* =====================================================
   作答
===================================================== */

function chooseAnswer(team,index,button){

  if(roundFinished) return;

  const now=
  performance.now()-questionStartTime;

  if(team==="red"){

    if(redAnswer!==null) return;

    redAnswer=index;
    redTime=now;

    lockTeam("red");

    button.classList.add("selected");

  }

  if(team==="blue"){

    if(blueAnswer!==null) return;

    blueAnswer=index;
    blueTime=now;

    lockTeam("blue");

    button.classList.add("selected");

  }

  /*
  兩隊都作答後立即判定
  */

  if(
    redAnswer!==null &&
    blueAnswer!==null
  ){

    finishRound();

  }

}


/* =====================================================
   鎖定單隊答案
===================================================== */

function lockTeam(team){

  const container=
  team==="red"
  ? redAnswersEl
  : blueAnswersEl;

  container
  .querySelectorAll("button")
  .forEach(btn=>btn.disabled=true);

}


/* =====================================================
   本回合結束
===================================================== */

function finishRound(){

  if(roundFinished) return;

  roundFinished=true;

  clearInterval(timerInterval);

  const q=questions[currentQuestion];

  revealAnswers(q.correct);

  const redCorrect=
  redAnswer===q.correct;

  const blueCorrect=
  blueAnswer===q.correct;


  /* =========================
     判定
  ========================= */

  if(redCorrect && !blueCorrect){

    showStatus("🔴 ĐỘI ĐỎ KÉO!");

    moveRope(-1);

  }

  else if(blueCorrect && !redCorrect){

    showStatus("ĐỘI XANH KÉO! 🔵");

    moveRope(1);

  }

  else if(redCorrect && blueCorrect){

    /*
    兩隊都正確
    比速度
    */

    const difference=
    Math.abs(redTime-blueTime);

    /*
    50毫秒內視為平手
    */

    if(difference<50){

      showStatus("⚡ HÒA! CẢ HAI QUÁ NHANH!");

    }

    else if(redTime<blueTime){

      showStatus("⚡ ĐỘI ĐỎ NHANH HƠN!");

      moveRope(-1);

    }

    else{

      showStatus("⚡ ĐỘI XANH NHANH HƠN!");

      moveRope(1);

    }

  }

  else{

    showStatus("😅 KHÔNG ĐỘI NÀO KÉO!");

  }


  /* =========================
     勝負判斷
  ========================= */

  if(ropePosition<=-WIN_SCORE){

    setTimeout(
      ()=>showWinner("red"),
      1100
    );

    return;

  }

  if(ropePosition>=WIN_SCORE){

    setTimeout(
      ()=>showWinner("blue"),
      1100
    );

    return;

  }


  /* =========================
     下一題
  ========================= */

  setTimeout(()=>{

    currentQuestion++;

    /*
    題庫用完
    從第一題重新開始
    直到有人真的把繩子拉過去
    */

    if(currentQuestion>=questions.length){

      currentQuestion=0;

    }

    loadQuestion();

  },2200);

}


/* =====================================================
   顯示答案
===================================================== */

function revealAnswers(correct){

  [
    redAnswersEl,
    blueAnswersEl
  ].forEach(container=>{

    const buttons=
    container.querySelectorAll("button");

    buttons.forEach(
      (button,index)=>{

        button.disabled=true;

        if(index===correct){

          button.classList.add("correct");

        }

      }
    );

  });


  /*
  顯示各隊答錯
  */

  if(
    redAnswer!==null &&
    redAnswer!==correct
  ){

    redAnswersEl
    .children[redAnswer]
    .classList.add("wrong");

  }

  if(
    blueAnswer!==null &&
    blueAnswer!==correct
  ){

    blueAnswersEl
    .children[blueAnswer]
    .classList.add("wrong");

  }

}


/* =====================================================
   移動拔河系統
===================================================== */

function moveRope(direction){

  ropePosition+=direction;

  const position=
  ropePosition*STEP;

  tugSystem.style.setProperty(
    "--rope-x",
    position+"vw"
  );

  tugSystem.style.transform=
  `translateX(${position}vw)`;


  /*
  拉扯動畫
  */

  if(direction<0){

    tugSystem.classList.remove(
      "pull-blue"
    );

    void tugSystem.offsetWidth;

    tugSystem.classList.add(
      "pull-red"
    );

  }

  else{

    tugSystem.classList.remove(
      "pull-red"
    );

    void tugSystem.offsetWidth;

    tugSystem.classList.add(
      "pull-blue"
    );

  }

}


/* =====================================================
   狀態訊息
===================================================== */

function showStatus(text){

  statusEl.textContent=text;

  statusEl.classList.add("show");

  setTimeout(()=>{

    statusEl.classList.remove("show");

  },1700);

}


/* =====================================================
   勝利
===================================================== */

function showWinner(team){

  clearInterval(timerInterval);

  winnerScreen.classList.add("show");

  if(team==="red"){

    winnerText.textContent=
    "🔴 ĐỘI ĐỎ THẮNG!";

  }

  else{

    winnerText.textContent=
    "ĐỘI XANH THẮNG! 🔵";

  }

}


/* =====================================================
   重新開始
===================================================== */

function restartGame(){

  currentQuestion=0;

  ropePosition=0;

  tugSystem.style.transform=
  "translateX(0)";

  tugSystem.style.setProperty(
    "--rope-x",
    "0vw"
  );

  winnerScreen.classList.remove("show");

  loadQuestion();

}


/* =====================================================
   開始遊戲
===================================================== */

tugSystem.style.setProperty(
  "--rope-x",
  "0vw"
);

loadQuestion();

</script>

</body>
</html>
