<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>越南語拔河大賽</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:#eef3f8;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-rows:18% 49% 33%;
  background:#fff;
}

.question-area{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:10px 120px;
  background:#fff;
  z-index:10;
}

.game-title{
  font-size:clamp(13px,1.2vw,20px);
  letter-spacing:2px;
  color:#777;
  margin-bottom:7px;
}

.question{
  font-size:clamp(27px,3vw,52px);
  font-weight:900;
  text-align:center;
  color:#202124;
  line-height:1.15;
}

.timer{
  position:absolute;
  right:5%;
  top:50%;
  transform:translateY(-50%);
  width:82px;
  height:82px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ef3340;
  color:#fff;
  font-size:36px;
  font-weight:900;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.progress{
  position:absolute;
  left:4%;
  top:50%;
  transform:translateY(-50%);
  color:#777;
  font-size:18px;
  font-weight:700;
}

.sound-btn{
  position:absolute;
  right:1.5%;
  top:10px;
  z-index:30;
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  background:#ffffff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  font-size:23px;
  cursor:pointer;
}

.arena{
  position:relative;
  overflow:hidden;
  background-image:url("assets/background.png");
  background-size:cover;
  background-position:center;
}

.center-line{
  position:absolute;
  left:50%;
  bottom:0;
  height:52%;
  width:5px;
  background:rgba(255,255,255,.92);
  transform:translateX(-50%);
  z-index:2;
}

.center-line::after{
  content:"";
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
}

.tug-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:5;
  pointer-events:none;
}

.tug-image{
  width:96%;
  height:auto;
  max-height:88%;
  object-fit:contain;
  object-position:center bottom;
  transform:translateX(0);
  transition:transform .55s cubic-bezier(.22,1,.36,1);
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.16));
}

.tug-image.pull-left{
  animation:pullLeft .5s ease;
}

.tug-image.pull-right{
  animation:pullRight .5s ease;
}

@keyframes pullLeft{
  0%{transform:translateX(var(--x));}
  40%{transform:translateX(calc(var(--x) - 18px));}
  100%{transform:translateX(var(--x));}
}

@keyframes pullRight{
  0%{transform:translateX(var(--x));}
  40%{transform:translateX(calc(var(--x) + 18px));}
  100%{transform:translateX(var(--x));}
}

.team-label{
  position:absolute;
  bottom:4%;
  padding:9px 25px;
  color:#fff;
  border-radius:30px;
  font-weight:900;
  font-size:clamp(14px,1.5vw,25px);
  z-index:8;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.red-label{
  left:3%;
  background:#e93443;
}

.blue-label{
  right:3%;
  background:#287ce0;
}

.status{
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  background:rgba(255,255,255,.95);
  padding:8px 20px;
  border-radius:30px;
  font-size:18px;
  font-weight:900;
  box-shadow:0 3px 12px rgba(0,0,0,.14);
  opacity:0;
  transition:.25s;
}

.status.show{
  opacity:1;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f5f7fb;
  min-height:0;
}

.team-panel{
  padding:10px 20px 14px;
  min-width:0;
}

.red-panel{
  border-right:2px solid #dfe5ed;
}

.panel-title{
  text-align:center;
  font-size:clamp(17px,1.8vw,29px);
  font-weight:900;
  margin-bottom:8px;
}

.red-panel .panel-title{
  color:#d93242;
}

.blue-panel .panel-title{
  color:#2878d4;
}

.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.answer-btn{
  min-height:58px;
  border-radius:15px;
  background:#fff;
  font-size:clamp(14px,1.35vw,22px);
  font-weight:800;
  cursor:pointer;
  transition:.18s;
  padding:8px 12px;
}

.red-panel .answer-btn{
  border:3px solid #f3a4aa;
  color:#bb3440;
}

.blue-panel .answer-btn{
  border:3px solid #92bff1;
  color:#2674c8;
}

.answer-btn:hover{
  transform:translateY(-2px);
}

.answer-btn:active{
  transform:scale(.97);
}

.answer-btn.selected{
  background:#fff2a8 !important;
  border-color:#f1b900 !important;
  color:#222 !important;
}

.answer-btn.correct{
  background:#dff7e5 !important;
  border-color:#38ad61 !important;
  color:#177438 !important;
}

.answer-btn.wrong{
  background:#ffe2e4 !important;
  border-color:#ef5963 !important;
  color:#b5222d !important;
}

.answer-btn:disabled{
  cursor:default;
}

#winnerScreen{
  position:fixed;
  inset:0;
  background:rgba(10,20,35,.84);
  z-index:100;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:#fff;
  text-align:center;
}

#winnerScreen.show{
  display:flex;
}

#winnerEmoji{
  font-size:100px;
}

#winnerText{
  font-size:clamp(40px,6vw,90px);
  font-weight:900;
  margin:15px;
}

.restart{
  border:none;
  background:#fff;
  padding:15px 35px;
  border-radius:30px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

@media(max-width:800px){
  #game{
    grid-template-rows:18% 44% 38%;
  }

  .question-area{
    padding:10px 80px;
  }

  .timer{
    width:58px;
    height:58px;
    font-size:25px;
  }

  .progress{
    display:none;
  }

  .team-panel{
    padding:8px;
  }

  .answer-grid{
    gap:5px;
  }

  .answer-btn{
    min-height:48px;
  }

  .tug-image{
    width:98%;
    max-height:90%;
  }
}
</style>
</head>

<body>

<div id="game">

  <header class="question-area">

    <div class="progress" id="progress">
      Câu 1/6
    </div>

    <div class="game-title">
      🇻🇳 VIETNAMESE TUG OF WAR
    </div>

    <div class="question" id="question">
      Bạn tên là gì?
    </div>

    <div class="timer" id="timer">
      20
    </div>

    <button class="sound-btn" id="soundBtn">🔊</button>

  </header>

  <main class="arena">

    <div class="center-line"></div>

    <div class="status" id="status">
      Chuẩn bị!
    </div>

    <div class="tug-wrap">
      <img
        src="assets/tug-war.png"
        class="tug-image"
        id="tugImage"
        alt="Vietnamese Tug of War"
      >
    </div>

    <div class="team-label red-label">
      🔴 ĐỘI ĐỎ
    </div>

    <div class="team-label blue-label">
      ĐỘI XANH 🔵
    </div>

  </main>

  <section class="answers">

    <div class="team-panel red-panel">
      <div class="panel-title">🔴 ĐỘI ĐỎ</div>
      <div class="answer-grid" id="redAnswers"></div>
    </div>

    <div class="team-panel blue-panel">
      <div class="panel-title">🔵 ĐỘI XANH</div>
      <div class="answer-grid" id="blueAnswers"></div>
    </div>

  </section>

</div>

<div id="winnerScreen">
  <div id="winnerEmoji">🏆</div>
  <div id="winnerText">ĐỘI ĐỎ THẮNG!</div>
  <button class="restart" id="restartBtn">Chơi lại</button>
</div>

<audio id="bgm" src="assets/bgm.mp3" loop></audio>
<audio id="countdownSound" src="assets/countdown.mp3"></audio>
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="winSound" src="assets/win.mp3"></audio>

<script>

const questions = [
{
  question:"Bạn tên là gì?",
  answers:["你幾歲？","你叫什麼名字？","你住在哪裡？","你喜歡什麼？"],
  correct:1
},
{
  question:"“Xin chào” nghĩa là gì?",
  answers:["再見","你好","謝謝","對不起"],
  correct:1
},
{
  question:"“Màu đỏ” là màu gì?",
  answers:["藍色","黃色","紅色","綠色"],
  correct:2
},
{
  question:"Bạn bao nhiêu tuổi?",
  answers:["你幾歲？","你叫什麼名字？","你是哪國人？","你喜歡什麼？"],
  correct:0
},
{
  question:"Tôi thích nghe nhạc.",
  answers:["我喜歡看書","我喜歡聽音樂","我喜歡運動","我喜歡旅行"],
  correct:1
},
{
  question:"“Cảm ơn” nghĩa là gì?",
  answers:["謝謝","對不起","你好","再見"],
  correct:0
}
];

const QUESTION_TIME = 20;
const WIN_SCORE = 5;
const STEP = 2.8;

let currentQuestion = 0;
let ropePosition = 0;

let redAnswer = null;
let blueAnswer = null;

let redTime = null;
let blueTime = null;

let questionStartTime = null;

let timeLeft = QUESTION_TIME;
let timerInterval = null;

let roundFinished = false;

let soundEnabled = true;
let audioStarted = false;

const questionEl = document.getElementById("question");
const progressEl = document.getElementById("progress");
const timerEl = document.getElementById("timer");

const redAnswersEl = document.getElementById("redAnswers");
const blueAnswersEl = document.getElementById("blueAnswers");

const tugImage = document.getElementById("tugImage");
const statusEl = document.getElementById("status");

const winnerScreen = document.getElementById("winnerScreen");
const winnerText = document.getElementById("winnerText");
const restartBtn = document.getElementById("restartBtn");

const soundBtn = document.getElementById("soundBtn");

const bgm = document.getElementById("bgm");
const countdownSound = document.getElementById("countdownSound");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const winSound = document.getElementById("winSound");

bgm.volume = 0.26;
countdownSound.volume = 0.65;
correctSound.volume = 0.75;
wrongSound.volume = 0.75;
winSound.volume = 0.9;

function startAudio(){
  if(audioStarted || !soundEnabled) return;

  audioStarted = true;

  bgm.currentTime = 0;
  bgm.play().catch(()=>{});
}

function playSound(audio){
  if(!soundEnabled) return;

  audio.currentTime = 0;
  audio.play().catch(()=>{});
}

soundBtn.addEventListener("click",()=>{

  soundEnabled = !soundEnabled;

  if(soundEnabled){
    soundBtn.textContent = "🔊";

    if(audioStarted){
      bgm.play().catch(()=>{});
    }else{
      startAudio();
    }

  }else{
    soundBtn.textContent = "🔇";
    bgm.pause();

    countdownSound.pause();
    correctSound.pause();
    wrongSound.pause();
    winSound.pause();
  }

});

function loadQuestion(){

  clearInterval(timerInterval);

  countdownSound.pause();
  countdownSound.currentTime = 0;

  roundFinished = false;

  redAnswer = null;
  blueAnswer = null;

  redTime = null;
  blueTime = null;

  timeLeft = QUESTION_TIME;

  const q = questions[currentQuestion];

  questionEl.textContent = q.question;

  progressEl.textContent =
  `Câu ${currentQuestion + 1}/${questions.length}`;

  timerEl.textContent = timeLeft;
  timerEl.style.background = "#ef3340";

  createAnswers(redAnswersEl,"red",q);
  createAnswers(blueAnswersEl,"blue",q);

  questionStartTime = performance.now();

  timerInterval = setInterval(()=>{

    timeLeft--;

    timerEl.textContent = timeLeft;

    if(timeLeft <= 5){
      timerEl.style.background = "#ff7a00";
    }else{
      timerEl.style.background = "#ef3340";
    }

    if(timeLeft === 5){
      playSound(countdownSound);
    }

    if(timeLeft <= 0){
      clearInterval(timerInterval);
      finishRound();
    }

  },1000);

}

function createAnswers(container,team,q){

  container.innerHTML = "";

  const letters = ["A","B","C","D"];

  q.answers.forEach((answer,index)=>{

    const button = document.createElement("button");

    button.className = "answer-btn";

    button.innerHTML =
    `<strong>${letters[index]}.</strong> ${answer}`;

    button.addEventListener(
      "click",
      ()=>chooseAnswer(team,index,button)
    );

    container.appendChild(button);

  });

}

function chooseAnswer(team,index,button){

  startAudio();

  if(roundFinished) return;

  const answerTime =
  performance.now() - questionStartTime;

  if(team === "red"){

    if(redAnswer !== null) return;

    redAnswer = index;
    redTime = answerTime;

    lockTeam(redAnswersEl);
    button.classList.add("selected");

  }

  if(team === "blue"){

    if(blueAnswer !== null) return;

    blueAnswer = index;
    blueTime = answerTime;

    lockTeam(blueAnswersEl);
    button.classList.add("selected");

  }

  if(
    redAnswer !== null &&
    blueAnswer !== null
  ){
    finishRound();
  }

}

function lockTeam(container){

  container
  .querySelectorAll("button")
  .forEach(btn=>{
    btn.disabled = true;
  });

}

function finishRound(){

  if(roundFinished) return;

  roundFinished = true;

  clearInterval(timerInterval);

  countdownSound.pause();
  countdownSound.currentTime = 0;

  const q = questions[currentQuestion];

  revealAnswers(q.correct);

  const redCorrect = redAnswer === q.correct;
  const blueCorrect = blueAnswer === q.correct;

  if(redCorrect && !blueCorrect){

    playSound(correctSound);

    showStatus("🔴 ĐỘI ĐỎ KÉO!");

    moveTug(-1);

  }

  else if(blueCorrect && !redCorrect){

    playSound(correctSound);

    showStatus("ĐỘI XANH KÉO! 🔵");

    moveTug(1);

  }

  else if(redCorrect && blueCorrect){

    playSound(correctSound);

    const difference =
    Math.abs(redTime - blueTime);

    if(difference < 50){

      showStatus("⚡ HÒA!");

    }

    else if(redTime < blueTime){

      showStatus("⚡ ĐỘI ĐỎ NHANH HƠN!");

      moveTug(-1);

    }

    else{

      showStatus("⚡ ĐỘI XANH NHANH HƠN!");

      moveTug(1);

    }

  }

  else{

    playSound(wrongSound);

    showStatus("😅 KHÔNG ĐỘI NÀO KÉO!");

  }

  if(ropePosition <= -WIN_SCORE){

    setTimeout(
      ()=>showWinner("red"),
      900
    );

    return;
  }

  if(ropePosition >= WIN_SCORE){

    setTimeout(
      ()=>showWinner("blue"),
      900
    );

    return;
  }

  setTimeout(()=>{

    currentQuestion++;

    if(currentQuestion >= questions.length){
      currentQuestion = 0;
    }

    loadQuestion();

  },2200);

}

function revealAnswers(correct){

  [
    redAnswersEl,
    blueAnswersEl
  ].forEach(container=>{

    const buttons =
    container.querySelectorAll("button");

    buttons.forEach((button,index)=>{

      button.disabled = true;

      if(index === correct){
        button.classList.add("correct");
      }

    });

  });

  if(
    redAnswer !== null &&
    redAnswer !== correct
  ){
    redAnswersEl
    .children[redAnswer]
    .classList.add("wrong");
  }

  if(
    blueAnswer !== null &&
    blueAnswer !== correct
  ){
    blueAnswersEl
    .children[blueAnswer]
    .classList.add("wrong");
  }

}

function moveTug(direction){

  ropePosition += direction;

  const position =
  ropePosition * STEP;

  tugImage.style.setProperty(
    "--x",
    position + "vw"
  );

  tugImage.style.transform =
  `translateX(${position}vw)`;

  if(direction < 0){

    tugImage.classList.remove("pull-right");
    tugImage.classList.remove("pull-left");

    void tugImage.offsetWidth;

    tugImage.classList.add("pull-left");

  }else{

    tugImage.classList.remove("pull-left");
    tugImage.classList.remove("pull-right");

    void tugImage.offsetWidth;

    tugImage.classList.add("pull-right");
  }

}

function showStatus(text){

  statusEl.textContent = text;
  statusEl.classList.add("show");

  setTimeout(()=>{
    statusEl.classList.remove("show");
  },1700);

}

function showWinner(team){

  clearInterval(timerInterval);

  bgm.pause();
  bgm.currentTime = 0;

  countdownSound.pause();
  countdownSound.currentTime = 0;

  playSound(winSound);

  winnerScreen.classList.add("show");

  if(team === "red"){
    winnerText.textContent =
    "🔴 ĐỘI ĐỎ THẮNG!";
  }else{
    winnerText.textContent =
    "ĐỘI XANH THẮNG! 🔵";
  }

}

function restartGame(){

  clearInterval(timerInterval);

  currentQuestion = 0;
  ropePosition = 0;

  tugImage.style.setProperty(
    "--x",
    "0vw"
  );

  tugImage.style.transform =
    "translateX(0)";

  winnerScreen.classList.remove("show");

  if(soundEnabled){
    bgm.currentTime = 0;
    bgm.play().catch(()=>{});
  }

  loadQuestion();
}

restartBtn.addEventListener(
  "click",
  restartGame
);

tugImage.style.setProperty(
  "--x",
  "0vw"
);

loadQuestion();

</script>

</body>
</html>
