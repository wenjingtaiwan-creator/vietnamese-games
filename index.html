<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>葉子教室遊戲室</title>

<!-- Excel / CSV 讀取 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --ink:#223047;
  --muted:#748095;
  --paper:#ffffff;
  --brand:#6d55f5;
  --brand2:#8d6bff;
  --red:#ef4b5a;
  --blue:#338fe8;
  --green:#29b36a;
  --yellow:#ffd73f;
  --shadow:0 12px 34px rgba(31,42,68,.14);
  --radius:24px;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(135deg,#f5fbf4,#fff9d7,#fff0f4);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{text-decoration:none;color:inherit}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #e8ebf1;
}
.topbar-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  font-weight:1000;
  font-size:20px;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:26px 18px 56px;
}
.hero{
  text-align:center;
  padding:28px 10px 20px;
}
.hero h1{
  margin:0;
  font-size:clamp(36px,5vw,64px);
}
.hero p{
  color:var(--muted);
  font-size:18px;
}
.lang-select,.input,.select,textarea{
  border:2px solid #e2e6ee;
  border-radius:15px;
  background:#fff;
  padding:11px 13px;
  outline:none;
}
.lang-select:focus,.input:focus,.select:focus,textarea:focus{
  border-color:var(--brand);
}
.btn{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-weight:900;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.btn.primary{
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;
}
.btn.green{background:var(--green);color:#fff}
.btn.blue-btn{background:var(--blue);color:#fff}
.btn.red-btn{background:var(--red);color:#fff}
.btn.ghost{background:#eef1f6;color:#39465b}
.btn.small{padding:8px 13px;font-size:14px}
.card,.section{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.game-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}
.game-card{
  min-height:240px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border:2px solid transparent;
  transition:.2s;
}
.game-card:hover{
  transform:translateY(-4px);
  border-color:#ddd7ff;
}
.game-icon{font-size:58px}
.game-card h2{margin:10px 0 8px;font-size:29px}
.game-card p{color:var(--muted);line-height:1.7}
.section{margin:18px 0}
.section h2{margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:220px}
.note{
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}
.status{
  margin-top:12px;
  border-radius:14px;
  padding:11px 13px;
  display:none;
  font-weight:800;
}
.status.show{display:block}
.status.ok{background:#e2f8ea;color:#19713d}
.status.err{background:#ffe6e9;color:#aa2632}
.status.info{background:#fff5cc;color:#776000}
.recent-list{display:grid;gap:9px;margin-top:10px}
.recent-item{
  background:#f7f8fb;
  border-radius:14px;
  padding:10px 12px;
  display:flex;
  gap:10px;
  align-items:center;
}
.recent-item .name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.qcard{
  margin:12px 0;
  padding:15px;
  border:2px solid #edf0f5;
  border-radius:18px;
}
.qhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.qhead strong{font-size:18px}
.answer-edit{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}
.answer-edit label{
  display:flex;
  gap:7px;
  align-items:center;
}
.answer-edit input{width:100%}

/* 共用遊戲殼 */
.game-shell{
  height:100vh;
  min-height:100vh;
  background:#101726;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.game-header{
  background:#fff;
  min-height:78px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:space-between;
  z-index:10;
}
.game-header .center{
  flex:1;
  text-align:center;
}
.game-header .tiny-title{
  font-weight:1000;
  font-size:16px;
}
.game-header .game-question{
  font-size:clamp(26px,3vw,50px);
  font-weight:1000;
  line-height:1.15;
}
.question-banner{
  display:inline-block;
  min-width:min(560px,62vw);
  max-width:72vw;
  padding:8px 22px;
  border-radius:18px;
  background:#fff7d6;
  border:3px solid #ffd45c;
  box-shadow:0 5px 16px rgba(53,65,90,.12);
  color:#172238;
}
.game-brand{
  font-size:15px;
  white-space:nowrap;
  color:#344055;
}

@media(max-height:760px){
  .game-header{min-height:66px;padding:7px 12px}
  .game-header .tiny-title{font-size:14px}
  .game-header .game-question{font-size:clamp(18px,2.2vw,32px)}
  .tug-team{padding:7px}
  .tug-team h3{margin-bottom:5px}
  .answer-btn{min-height:48px;padding:7px 9px}
}
.game-main{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}
.game-footer{
  background:#fff;
  min-height:82px;
  padding:10px 14px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  background:#eef1f6;
  border-radius:999px;
  font-weight:900;
}
.modal{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(8,14,25,.74);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex}
.modal-card{
  width:min(560px,94vw);
  background:#fff;
  border-radius:26px;
  padding:28px;
  text-align:center;
  box-shadow:var(--shadow);
}

/* 拔河 */
.tug-game-main{
  display:flex;
  flex-direction:column;
  min-height:0;
  background:#fff;
}
.tug-arena{
  flex:1 1 auto;
  height:auto;
  min-height:0;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,.02)),
    url("assets/background.png") center/cover no-repeat;
}
.tug-stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.tug-stage img{
  width:min(96%,1180px);
  max-height:94%;
  object-fit:contain;
  transition:transform .38s ease;
  filter:drop-shadow(0 10px 9px rgba(0,0,0,.14));
}
.center-line{
  position:absolute;
  left:50%;
  top:39%;
  height:46%;
  border-left:5px dashed rgba(255,255,255,.95);
  transform:translateX(-50%);
  pointer-events:none;
}

.tug-countdown{
  position:absolute;
  inset:0;
  z-index:25;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.tug-countdown .count-number{
  width:160px;
  height:160px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(15,22,36,.78);
  color:#fff;
  border:8px solid rgba(255,255,255,.97);
  font-size:98px;
  line-height:1;
  font-weight:1000;
  text-shadow:0 6px 15px rgba(0,0,0,.45);
  box-shadow:0 18px 48px rgba(0,0,0,.34);
}
@keyframes countPop{
  from{transform:scale(.68);opacity:.35}
  to{transform:scale(1);opacity:1}
}
.tug-team-tag{
  position:absolute;
  bottom:10px;
  font-weight:1000;
  color:#fff;
  padding:8px 17px;
  border-radius:999px;
  box-shadow:0 6px 14px rgba(0,0,0,.16);
}
.tug-team-tag.red{left:16px;background:var(--red)}
.tug-team-tag.blue{right:16px;background:var(--blue)}
.tug-answer-zone{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#fff;
}
.tug-team{
  position:relative;
  padding:10px;
  background:#fff; /* 重要：維持原本白底，不出現整塊藍色 */
}
.tug-team:first-child{border-right:2px solid #e7eaf0}
.tug-team h3{
  margin:0 0 8px;
  text-align:center;
}
.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.answer-btn{
  min-height:56px;
  padding:9px 10px;
  border-radius:14px;
  background:#fff;
  font-weight:900;
  border:3px solid #dde4ed;
}
.tug-team.red .answer-btn{border-color:#f2a7ae}
.tug-team.blue .answer-btn{border-color:#a4cdf4}
.answer-btn.good{background:#def7e6;border-color:#36ad63!important}
.answer-btn.bad{background:#ffe4e7;border-color:#ef5b66!important}
.dual-qbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#fff;
  border-bottom:1px solid #eee;
}
.dual-qbar>div{
  padding:8px 10px;
  text-align:center;
  font-weight:1000;
}
.dual-qbar>div:first-child{border-right:2px solid #eee}
.penalty{
  position:absolute;
  inset:0;
  z-index:5;
  background:rgba(17,24,38,.92);
  color:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-weight:1000;
}
.penalty.show{display:flex}
.penalty .count{font-size:64px}

/* 會飛的字 */
.fly-field{
  position:relative;
  height:100%;
  min-height:430px;
  overflow:hidden;
  background:linear-gradient(135deg,#ffe400,#ffc72f);
}
.fly-word{
  position:absolute;
  border:3px solid rgba(255,255,255,.86);
  border-radius:17px;
  padding:14px 22px;
  color:#fff;
  font-size:clamp(18px,2vw,31px);
  font-weight:1000;
  box-shadow:0 12px 20px rgba(0,0,0,.18);
  user-select:none;
}
.fly-word:disabled{opacity:.25}
.fly-slots{
  display:flex;
  gap:9px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}
.fly-slot{
  min-width:66px;
  min-height:46px;
  border:3px dashed #b8c1dc;
  border-radius:15px;
  background:#f7f8fd;
  padding:7px 10px;
  font-weight:900;
  text-align:center;
}

/* 左右擺頭 */
.head-layout{
  height:100%;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 280px 1fr;
  gap:18px;
  align-items:center;
  background:linear-gradient(180deg,#fff,#f3f7fb);
}
.head-choice{
  min-height:260px;
  border:0;
  border-radius:28px;
  color:#fff;
  font-weight:1000;
  font-size:clamp(24px,3vw,46px);
  padding:20px;
}
.head-choice.left{background:#2eaee4}
.head-choice.right{background:#ff6c45}
.cam-column{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.cam-circle{
  width:250px;
  height:250px;
  border-radius:50%;
  overflow:hidden;
  border:8px solid #58bc68;
  background:#111621;
}
.cam-circle video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}
.head-hint{
  text-align:center;
  font-weight:900;
  line-height:1.5;
}

/* 探險 */
.adventure-map{
  height:100%;
  overflow:auto;
  padding:22px;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.45),transparent 18%),
    linear-gradient(#91defa,#d8f6cf 47%,#ecd098);
}
.adventure-path{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}
.adventure-cell{
  aspect-ratio:1;
  border-radius:22px;
  background:#fff;
  border:4px solid rgba(255,255,255,.65);
  box-shadow:0 8px 15px rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-size:27px;
  font-weight:1000;
}
.adventure-cell.special{background:#fff1a9}
.token{
  position:absolute;
  font-size:38px;
  filter:drop-shadow(0 5px 3px rgba(0,0,0,.25));
}
.token.red-token{left:4px;bottom:0}
.token.blue-token{right:4px;top:0}
.dice-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}
.dice-face{font-size:52px}
.option-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.option-btn{
  border:3px solid #e0e5ee;
  background:#fff;
  border-radius:16px;
  padding:13px;
  font-weight:900;
}
.option-btn.good{background:#def7e6;border-color:#38af65}
.option-btn.bad{background:#ffe4e7;border-color:#ed5965}

@media(max-width:820px){
  .game-brand{display:none}
  .question-banner{min-width:0;max-width:100%;padding:7px 12px}
  .game-grid{grid-template-columns:1fr}
  .answer-edit{grid-template-columns:1fr}
  .tug-answer-zone{grid-template-columns:1fr}
  .tug-team:first-child{border-right:0;border-bottom:2px solid #e7eaf0}
  .tug-arena{min-height:260px}
  .head-layout{grid-template-columns:1fr 1fr}
  .cam-column{grid-column:1/-1;grid-row:1}
  .cam-circle{width:150px;height:150px}
  .head-choice{min-height:160px}
  .adventure-path{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>

<body>

<!-- 聲音 -->
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
<audio id="countdownSound" src="assets/countdown.mp3" preload="auto"></audio>
<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="winSound" src="assets/win.mp3" preload="auto"></audio>

<!-- 大廳 -->
<section id="lobbyView">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">🍃 葉子教室遊戲室</div>
      <select id="lobbyLang" class="lang-select"></select>
    </div>
  </div>

  <div class="container">
    <div class="hero">
      <h1>🍃 葉子教室遊戲室</h1>
      <p data-i18n="chooseGame"></p>
    </div>

    <div class="game-grid">
      <div class="card game-card" onclick="openSetup('tug')">
        <div>
          <div class="game-icon">🪢</div>
          <h2 id="nameTug">拔河大賽</h2>
          <p data-i18n="classic"></p>
          <p data-i18n="dual"></p>
        </div>
        <button class="btn primary"><span data-i18n="start"></span></button>
      </div>

      <div class="card game-card" onclick="openSetup('fly')">
        <div>
          <div class="game-icon">💨</div>
          <h2 id="nameFly">會飛的字</h2>
          <p data-i18n="tapOrder"></p>
        </div>
        <button class="btn primary"><span data-i18n="start"></span></button>
      </div>

      <div class="card game-card" onclick="openSetup('head')">
        <div>
          <div class="game-icon">↔️</div>
          <h2 id="nameHead">左右擺頭</h2>
          <p data-i18n="headInstruction"></p>
        </div>
        <button class="btn primary"><span data-i18n="start"></span></button>
      </div>

      <div class="card game-card" onclick="openSetup('adventure')">
        <div>
          <div class="game-icon">🗺️</div>
          <h2 id="nameAdventure">探險大挑戰</h2>
          <p data-i18n="adventure"></p>
        </div>
        <button class="btn primary"><span data-i18n="start"></span></button>
      </div>
    </div>
  </div>
</section>

<!-- 設定 -->
<section id="setupView" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <button class="btn ghost" onclick="backLobby()">← <span data-i18n="back"></span></button>
      <div class="brand">🍃 葉子教室遊戲室</div>
      <select id="setupLang" class="lang-select"></select>
    </div>
  </div>

  <div class="container">
    <div class="section">
      <h2 id="setupTitle"></h2>
      <div id="modeArea"></div>
      <p id="formatNote" class="note"></p>
    </div>

    <div class="section">
      <h2>☁️ <span data-i18n="google"></span></h2>
      <div class="row">
        <input id="sheetUrl" class="input grow" data-i18n-placeholder="paste">
        <input id="sheetName" class="input" data-i18n-placeholder="bankName">
        <button id="loadSheetBtn" class="btn green">☁️ <span data-i18n="load"></span></button>
      </div>
      <div class="note" data-i18n="googleHelp"></div>
      <div id="bankStatus" class="status"></div>
      <h3>⭐ <span data-i18n="recent"></span></h3>
      <div id="recentBanks" class="recent-list"></div>
    </div>

    <div class="section">
      <h2>📂 <span data-i18n="excel"></span></h2>
      <div class="row">
        <label class="btn blue-btn">
          📂 <span data-i18n="upload"></span>
          <input id="bankFile" type="file" accept=".xlsx,.xls,.csv" hidden>
        </label>
        <button id="downloadTemplateBtn" class="btn ghost">⬇️ <span data-i18n="downloadTemplate"></span></button>
      </div>
    </div>

    <div class="section">
      <h2>✏️ <span data-i18n="manual"></span></h2>
      <div class="row">
        <button id="addQuestionBtn" class="btn ghost">＋ <span data-i18n="add"></span></button>
        <button id="clearQuestionsBtn" class="btn ghost">🗑️ <span data-i18n="clear"></span></button>
        <span id="questionCount" class="pill"></span>
      </div>
      <div id="questionEditor"></div>
    </div>

    <div class="row" style="justify-content:center;margin-top:22px">
      <button id="startGameBtn" class="btn primary" style="font-size:20px;padding:15px 30px">
        ▶ <span data-i18n="start"></span>
      </button>
    </div>
  </div>
</section>

<!-- 遊戲 -->
<section id="gameView" class="hidden"></section>

<!-- 視窗 -->
<div id="modal" class="modal">
  <div id="modalCard" class="modal-card"></div>
</div>

<script>
/* =========================================================
   多語言
========================================================= */
const LANGS = {
  zh:{
    name:"中文",chooseGame:"選擇遊戲",start:"開始遊戲",back:"返回遊戲室",targetLang:"介面語言",
    google:"Google Sheet 題庫",paste:"貼上已開放查看權限的 Google Sheet 連結",
    bankName:"題庫名稱（選填）",load:"載入題庫",recent:"最近使用",use:"使用",remove:"移除",
    excel:"Excel / CSV",upload:"上傳題庫",downloadTemplate:"下載題庫範本",
    manual:"手動建立",add:"新增題目",clear:"清空",questions:"題",
    mode:"遊戲模式",sound:"音效",winner:"勝利！",correct:"答對！",wrong:"答錯！",
    red:"紅隊",blue:"藍隊",pause:"暫停",next:"下一題",score:"分數",camera:"攝影機",
    click:"點擊",roll:"擲骰子",retry:"再玩一次",loading:"正在載入…",
    invalid:"題庫格式不正確",loaded:"題庫載入成功",needBank:"請先載入題庫",
    googleHelp:"試算表必須設定為「知道連結的任何人都可查看」。",
    classic:"同題競速",dual:"雙線闖關",tapOrder:"依順序點擊字詞",
    headInstruction:"向左或向右擺頭選答案",adventure:"擲骰子前進並回答問題",
    turn:"回合",time:"時間",stop:"停止遊戲"
  },

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

   題庫讀取
========================================================= */
function parseCSV(text){
  const rows=[];
  let row=[],field="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){
      if(quoted&&text[i+1]==='"'){field+='"';i++}
      else quoted=!quoted;
    }else if(c===","&&!quoted){
      row.push(field);field="";
    }else if((c==="\n"||c==="\r")&&!quoted){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(field);
      if(row.some(x=>String(x).trim()))rows.push(row);
      row=[];field="";
    }else field+=c;
  }
  row.push(field);
  if(row.some(x=>String(x).trim()))rows.push(row);
  return rows;
}
function norm(s){
  return String(s??"").trim().toLowerCase().replace(/\s/g,"");
}
function rowsToQuestions(rows){
  if(!rows||rows.length<2)return [];
  const h=rows[0].map(norm);
  const findIndex=(names)=>{
    for(const n of names){
      const i=h.indexOf(norm(n));
      if(i>=0)return i;
    }
    return -1;
  };
  const qi=findIndex(["題目","問題","question","prompt","提示"]);
  const ai=findIndex(["a","選項a","答案a","詞塊1"]);
  const bi=findIndex(["b","選項b","答案b","詞塊2"]);
  const ci=findIndex(["c","選項c","答案c","詞塊3"]);
  const di=findIndex(["d","選項d","答案d","詞塊4"]);
  const ei=findIndex(["e","詞塊5"]);
  const fi=findIndex(["f","詞塊6"]);
  const gi=findIndex(["g","詞塊7"]);
  const hi=findIndex(["h","詞塊8"]);
  const ii=findIndex(["i","詞塊9"]);
  const ji=findIndex(["j","詞塊10"]);
  const ki=findIndex(["k","詞塊11"]);
  const li=findIndex(["l","詞塊12"]);
  const ri=findIndex(["正確答案","答案","correct","correctanswer","順序","order"]);

  if(qi<0||ai<0||bi<0)return [];

  const allAns=[ai,bi,ci,di,ei,fi,gi,hi,ii,ji,ki,li];

  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const q=String(row[qi]??"").trim();
    if(!q)continue;

    const answers=allAns
      .filter(i=>i>=0)
      .map(i=>String(row[i]??"").trim());

    const raw=ri>=0?String(row[ri]??"").trim().toUpperCase():"";
    let correct=null;
    let order=null;

    const map={A:0,B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9,K:10,L:11,
               "1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6,"8":7,"9":8,"10":9,"11":10,"12":11};

    if(raw && map[raw]!==undefined){
      correct=map[raw];
    }else if(raw){
      const toks=raw.split(/[,\s>→\-]+/).filter(Boolean);
      if(toks.length>1 && toks.every(x=>map[x]!==undefined)){
        order=toks.map(x=>map[x]);
      }
    }
    out.push({question:q,answers,correct,order});
  }
  return out;
}

}
function loadSavedQuestions(){
  try{return JSON.parse(localStorage.getItem("yeziQuestions")||"[]")}catch{return []}
}
function extractSheet(url){
  const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!m)return null;
  const gid=(url.match(/[?#&]gid=(\d+)/)||[])[1]||"0";
  return {id:m[1],gid};
}
async function loadGoogleSheet(url){
  const info=extractSheet(url);
  if(!info)throw new Error("bad-url");
  const csv=`https://docs.google.com/spreadsheets/d/${info.id}/gviz/tq?tqx=out:csv&gid=${info.gid}&t=${Date.now()}`;
  const res=await fetch(csv);
  if(!res.ok)throw new Error("fetch");
  const qs=rowsToQuestions(parseCSV(await res.text()));
  if(!qs.length)throw new Error("format");
  return qs;
}
function getRecentBanks(){
  try{return JSON.parse(localStorage.getItem("yeziRecentBanks")||"[]")}catch{return []}
}
function rememberBank(url,name){
  let a=getRecentBanks().filter(x=>x.url!==url);
  a.unshift({url,name:(name||"Google Sheet").trim(),time:Date.now()});
  a=a.slice(0,5);
  localStorage.setItem("yeziRecentBanks",JSON.stringify(a));
}
function removeRecentBank(url){
  const a=getRecentBanks().filter(x=>x.url!==url);
  localStorage.setItem("yeziRecentBanks",JSON.stringify(a));
  renderRecentBanks();
}
function showStatus(type,msg){
  bankStatus.className=`status show ${type}`;
  bankStatus.textContent=msg;
}
function renderRecentBanks(){
  if(!window.recentBanks)return;
  recentBanks.innerHTML="";
  const a=getRecentBanks();
  if(!a.length){
    recentBanks.innerHTML='<div class="note">—</div>';
    return;
  }
  a.forEach(it=>{
    const div=document.createElement("div");
    div.className="recent-item";
    div.innerHTML=`
      <div class="name">☁️ ${esc(it.name)}</div>
      <button class="btn small green">${t("use")}</button>
      <button class="btn small ghost">×</button>`;
    div.children[1].onclick=async()=>{
      sheetUrl.value=it.url;
      sheetName.value=it.name;
      await loadSheetFromUI(it.url,it.name);
    };
    div.children[2].onclick=()=>removeRecentBank(it.url);
    recentBanks.appendChild(div);
  });
}
async function loadSheetFromUI(url,name){
  showStatus("info",t("loading"));
  try{
    questions=await loadGoogleSheet(url);
    saveQuestions();
    rememberBank(url,name||"Google Sheet");
    renderQuestionEditor();
    renderRecentBanks();
    showStatus("ok",`${t("loaded")}：${questions.length}`);
  }catch{
    showStatus("err",`${t("invalid")}。${t("googleHelp")}`);
  }
}
function renderQuestionEditor(){
  if(!window.questionEditor)return;
  questionCount.textContent=`${questions.length} ${t("questions")}`;
  questionEditor.innerHTML="";

  questions.forEach((q,i)=>{
    const card=document.createElement("div");
    card.className="qcard";

    const maxAnswers=selectedGame==="fly"?12:4;
    const answerHtml=Array.from({length:maxAnswers},(_,j)=>{
      const letter=String.fromCharCode(65+j);
      return `
        <label>
          <b>${letter}</b>
          <input class="input" data-answer="${j}" value="${esc(q.answers?.[j]||"")}">
        </label>`;
    }).join("");

    card.innerHTML=`
      <div class="qhead">
        <strong>#${i+1}</strong>
        <button class="btn small ghost" data-delete>🗑️</button>
      </div>

      <input class="input" data-question style="width:100%;margin-top:10px" value="${esc(q.question||"")}">

      <div class="answer-edit">${answerHtml}</div>

      <div class="row" style="margin-top:10px">
        <label>Correct / Order</label>
        <input class="input grow" data-correct value="${
          q.order ? q.order.map(x=>String.fromCharCode(65+x)).join(",") :
          q.correct!=null ? String.fromCharCode(65+q.correct) : ""
        }">
      </div>`;

    card.querySelector("[data-delete]").onclick=()=>{
      questions.splice(i,1);
      saveQuestions();
      renderQuestionEditor();
    };
    card.querySelector("[data-question]").oninput=e=>{
      q.question=e.target.value;
      saveQuestions();
    };
    card.querySelectorAll("[data-answer]").forEach(el=>{
      el.oninput=e=>{
        q.answers=q.answers||[];
        q.answers[+el.dataset.answer]=e.target.value;
        saveQuestions();
      };
    });
    card.querySelector("[data-correct]").oninput=e=>{
      const raw=e.target.value.trim().toUpperCase();
      const map={A:0,B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9,K:10,L:11};
      if(map[raw]!==undefined){
        q.correct=map[raw];
        q.order=null;
      }else{
        const toks=raw.split(/[,\s>→\-]+/).filter(Boolean);
        if(toks.length>1&&toks.every(x=>map[x]!==undefined)){
          q.order=toks.map(x=>map[x]);
          q.correct=null;
        }else{
          q.order=null;
          q.correct=null;
        }
      }
      saveQuestions();
    };
    questionEditor.appendChild(card);
  });
}

   遊戲 1：拔河
========================================================= */
function startTug(){
  const qs=questions.filter(q=>q.question&&q.answers?.[0]&&q.answers?.[1]&&q.correct!=null);
  if(!qs.length){alert(t("invalid"));return}

  const mode=document.querySelector('input[name="gameMode"]:checked')?.value||"classic";

  setupView.classList.add("hidden");
  gameView.classList.remove("hidden");

  gameView.innerHTML=`
    <div class="game-shell">
      ${gameHeader("")}

      <div id="dualBar" class="dual-qbar hidden">
        <div id="redQuestion"></div>
        <div id="blueQuestion"></div>
      </div>

      <div class="game-main tug-game-main">
        <div class="tug-arena">
          <div id="tugCountdown" class="tug-countdown hidden">
            <div class="count-number" id="tugTimer">3</div>
          </div>
          <div class="center-line"></div>
          <div class="tug-stage">
            <img id="tugImage" src="assets/tug-war.png" alt="">
          </div>
          <div class="tug-team-tag red">🔴 <span id="redTag">${t("red")}</span></div>
          <div class="tug-team-tag blue"><span id="blueTag">${t("blue")}</span> 🔵</div>
        </div>

        <div class="tug-answer-zone">
          <div class="tug-team red">
            <h3>🔴 ${t("red")}</h3>
            <div id="redAnswers" class="answer-grid"></div>
            <div id="redPenalty" class="penalty"><div>${t("pause")}</div><div id="redPenaltyN" class="count">3</div></div>
          </div>

          <div class="tug-team blue">
            <h3>🔵 ${t("blue")}</h3>
            <div id="blueAnswers" class="answer-grid"></div>
            <div id="bluePenalty" class="penalty"><div>${t("pause")}</div><div id="bluePenaltyN" class="count">3</div></div>
          </div>
        </div>
      </div>
    </div>`;

  updateSoundButton();
  startBgm();

  const tugImage=document.getElementById("tugImage");
  const redAnswers=document.getElementById("redAnswers");
  const blueAnswers=document.getElementById("blueAnswers");
  const gameQuestion=document.getElementById("gameQuestion");
  const dualBar=document.getElementById("dualBar");
  const redQuestion=document.getElementById("redQuestion");
  const blueQuestion=document.getElementById("blueQuestion");
  const tugCountdown=document.getElementById("tugCountdown");
  const tugTimer=document.getElementById("tugTimer");

  let rope=0;
  const WIN=5;
  const STEP=3.0;

  function moveRope(dir){
    rope+=dir;
    tugImage.style.transform=`translateX(${rope*STEP}vw)`;
    if(Math.abs(rope)>=WIN){
      const team=rope<0?t("red"):t("blue");
      setTimeout(()=>showWinner(`${team} ${t("winner")}`),350);
      return true;
    }
    return false;
  }

  function renderAnswers(box,q,handler){
    box.innerHTML="";
    q.answers.slice(0,4).forEach((ans,i)=>{
      if(!ans)return;
      const b=document.createElement("button");
      b.className="answer-btn";
      b.textContent=`${String.fromCharCode(65+i)}. ${ans}`;
      b.onclick=()=>handler(i,b);
      box.appendChild(b);
    });
  }

  if(mode==="classic"){
    let index=0;
    let redChoice=null;
    let blueChoice=null;
    let redTime=0;
    let blueTime=0;
    let startedAt=0;
    let timerId=null;
    let remain=10;

    function loadQuestion(){
      redChoice=null;
      blueChoice=null;
      const q=qs[index%qs.length];
      gameQuestion.textContent=q.question;
      renderAnswers(redAnswers,q,(i,b)=>choose("red",i,b));
      renderAnswers(blueAnswers,q,(i,b)=>choose("blue",i,b));

      remain=10;
      tugTimer.textContent="3";
      tugCountdown.classList.add("hidden");
      startedAt=performance.now();

      clearInterval(timerId);
      timerId=setInterval(()=>{
        remain--;
        tugTimer.textContent=Math.max(0,remain);
        if(remain<=3 && remain>0) playFx(countdownSound);
        if(remain<=0){
          clearInterval(timerId);
          if(redChoice==null) redChoice=-1;
          if(blueChoice==null) blueChoice=-1;
          finishQuestion();
        }
      },1000);
    }

    function choose(team,i,b){
      if(team==="red"&&redChoice!=null)return;
      if(team==="blue"&&blueChoice!=null)return;

      if(team==="red"){
        redChoice=i;
        redTime=performance.now()-startedAt;
        [...redAnswers.children].forEach(x=>x.disabled=true);
      }else{
        blueChoice=i;
        blueTime=performance.now()-startedAt;
        [...blueAnswers.children].forEach(x=>x.disabled=true);
      }

      b.classList.add(i===qs[index%qs.length].correct?"good":"bad");

      if(redChoice!=null&&blueChoice!=null){
        clearInterval(timerId);
        tugCountdown.classList.add("hidden");
        finishQuestion();
      }
    }

    function finishQuestion(){
      const q=qs[index%qs.length];
      const rc=redChoice===q.correct;
      const bc=blueChoice===q.correct;

      [redAnswers,blueAnswers].forEach(box=>{
        [...box.children].forEach((btn,i)=>{
          if(i===q.correct)btn.classList.add("good");
          else if(btn.disabled)btn.classList.add("bad");
        });
      });

      if(rc||bc)playFx(correctSound);
      else playFx(wrongSound);

      let won=false;
      if(rc&&!bc)won=moveRope(-1);
      else if(bc&&!rc)won=moveRope(1);
      else if(rc&&bc&&Math.abs(redTime-blueTime)>=50){
        won=moveRope(redTime<blueTime?-1:1);
      }

      if(won)return;
      setTimeout(()=>{
        index=(index+1)%qs.length;
        loadQuestion();
      },1400);
    }

    loadQuestion();
    cleanupFns.push(()=>clearInterval(timerId));

  }else{
    dualBar.classList.remove("hidden");
    tugCountdown.classList.add("hidden");

    let redOrder=shuffle(qs.map((_,i)=>i));
    let blueOrder=shuffle(qs.map((_,i)=>i));
    if(qs.length>1&&redOrder[0]===blueOrder[0]){
      [blueOrder[0],blueOrder[1]]=[blueOrder[1],blueOrder[0]];
    }
    let ri=0,bi=0;
    let redLocked=false,blueLocked=false;
    let redAdvancePending=false,blueAdvancePending=false;
    let redAdvanceTimeout=null,blueAdvanceTimeout=null;

    function currentQ(team){
      return team==="red"?qs[redOrder[ri]]:qs[blueOrder[bi]];
    }

    function loadDual(team){
      const q=currentQ(team);
      if(team==="red"){
        redQuestion.textContent=q.question;
        renderAnswers(redAnswers,q,(i,b)=>chooseDual("red",i,b));
      }else{
        blueQuestion.textContent=q.question;
        renderAnswers(blueAnswers,q,(i,b)=>chooseDual("blue",i,b));
      }
    }

    function nextDual(team){
      if(team==="red"){
        redAdvancePending=false;
        ri++;
        if(ri>=redOrder.length){redOrder=shuffle(qs.map((_,i)=>i));ri=0}
        loadDual("red");
      }else{
        blueAdvancePending=false;
        bi++;
        if(bi>=blueOrder.length){blueOrder=shuffle(qs.map((_,i)=>i));bi=0}
        loadDual("blue");
      }
    }

    function chooseDual(team,i,b){
      const locked=team==="red"?redLocked:blueLocked;
      if(locked)return;

      const q=currentQ(team);
      const box=team==="red"?redAnswers:blueAnswers;

      if(i===q.correct){
        playFx(correctSound);
        b.classList.add("good");
        [...box.children].forEach(x=>x.disabled=true);

        if(moveRope(team==="red"?-1:1))return;

        if(team==="red"){
          redAdvancePending=true;
          clearTimeout(redAdvanceTimeout);
          redAdvanceTimeout=setTimeout(()=>nextDual("red"),380);
        }else{
          blueAdvancePending=true;
          clearTimeout(blueAdvanceTimeout);
          blueAdvanceTimeout=setTimeout(()=>nextDual("blue"),380);
        }
      }else{
        playFx(wrongSound);
        b.classList.add("bad");
        penalty(team);
      }
    }

    function penalty(team){
      const box=team==="red"?redAnswers:blueAnswers;
      const layer=team==="red"?redPenalty:bluePenalty;
      const num=team==="red"?redPenaltyN:bluePenaltyN;

      if(team==="red")redLocked=true;
      else blueLocked=true;

      let n=3;
      layer.classList.add("show");
      num.textContent=n;

      const id=setInterval(()=>{
        n--;
        if(n<=0){
          clearInterval(id);
          layer.classList.remove("show");

          if(team==="red")redLocked=false;
          else blueLocked=false;

          [...box.children].forEach(x=>{
            x.disabled=false;
            x.classList.remove("bad");
          });
        }else{
          num.textContent=n;
        }
      },1000);

      cleanupFns.push(()=>clearInterval(id));
    }

    loadDual("red");
    loadDual("blue");

    cleanupFns.push(()=>{
      clearTimeout(redAdvanceTimeout);
      clearTimeout(blueAdvanceTimeout);
    });
  }
}

/* =========================================================
   遊戲 2：會飛的字
========================================================= */
function startFly(){
  const qs=questions.filter(q=>q.question&&q.answers?.filter(Boolean).length>=2&&q.order?.length>=2);
  if(!qs.length){
    alert("會飛的字需要在「正確答案」填入順序，例如 A,B,C,D。");
    return;
  }

  setupView.classList.add("hidden");
  gameView.classList.remove("hidden");

  gameView.innerHTML=`
    <div class="game-shell">
      ${gameHeader("")}

      <div class="game-main">
        <div id="flyField" class="fly-field"></div>
      </div>

      <div class="game-footer">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="pill"><span data-i18n="score">${t("score")}</span>：<b id="flyScore">0</b></span>
          <span class="pill"><span data-i18n="time">${t("time")}</span>：<b id="flyTime">30</b></span>
          <button id="flyNext" class="btn ghost">${t("next")} ⏭️</button>
        </div>
        <div id="flySlots" class="fly-slots"></div>
      </div>
    </div>`;

  updateSoundButton();
  startBgm();

  const flyField=document.getElementById("flyField");
  const flySlots=document.getElementById("flySlots");
  const flyScore=document.getElementById("flyScore");
  const flyTime=document.getElementById("flyTime");
  const gameQuestion=document.getElementById("gameQuestion");

  let index=0;
  let score=0;
  let chosen=0;
  let items=[];
  let raf=null;
  let timer=null;
  let remain=30;
  let locked=false;

  const palette=["#633ad5","#e54d86","#22b7c7","#da8b2f","#3988df","#22b98a","#f25b58","#6e55e7","#19a6a1","#b06bdc","#e28e2d","#3676c8"];

  function stopMotion(){
    if(raf)cancelAnimationFrame(raf);
    raf=null;
    clearInterval(timer);
  }

  function loadQuestion(){
    stopMotion();
    locked=false;
    chosen=0;
    items=[];
    flyField.innerHTML="";
    flySlots.innerHTML="";

    const q=qs[index%qs.length];
    gameQuestion.textContent=q.question;

    q.order.forEach(()=>{
      const s=document.createElement("div");
      s.className="fly-slot";
      flySlots.appendChild(s);
    });

    q.answers.forEach((txt,i)=>{
      if(!txt)return;
      const b=document.createElement("button");
      b.className="fly-word";
      b.textContent=txt;
      b.style.background=palette[i%palette.length];
      flyField.appendChild(b);

      items.push({
        el:b,
        x:Math.random()*Math.max(1,flyField.clientWidth-180),
        y:Math.random()*Math.max(1,flyField.clientHeight-100),
        vx:(Math.random()*1.5+.8)*(Math.random()<.5?-1:1),
        vy:(Math.random()*1.2+.6)*(Math.random()<.5?-1:1)
      });

      b.onclick=()=>pick(i,b);
    });

    remain=30;
    flyTime.textContent=remain;

    timer=setInterval(()=>{
      remain--;
      flyTime.textContent=remain;

      if(remain<=3&&remain>0)playFx(countdownSound);

      if(remain<=0){
        clearInterval(timer);
        if(locked)return;
        locked=true;
        playFx(wrongSound);
        setTimeout(nextQuestion,1000);
      }
    },1000);

    animate();
  }

  function animate(){
    const w=flyField.clientWidth;
    const h=flyField.clientHeight;

    for(const o of items){
      if(!flyField.contains(o.el))continue;

      o.x+=o.vx;
      o.y+=o.vy;

      const ew=o.el.offsetWidth;
      const eh=o.el.offsetHeight;

      if(o.x<=0||o.x>=w-ew){
        o.vx*=-1;
        o.x=Math.max(0,Math.min(o.x,w-ew));
      }
      if(o.y<=0||o.y>=h-eh){
        o.vy*=-1;
        o.y=Math.max(0,Math.min(o.y,h-eh));
      }
      o.el.style.transform=`translate(${o.x}px,${o.y}px)`;
    }
    raf=requestAnimationFrame(animate);
  }

  function pick(i,b){
    if(locked)return;
    const q=qs[index%qs.length];
    const expected=q.order[chosen];

    if(i!==expected){
      playFx(wrongSound);
      remain=Math.max(0,remain-2);
      flyTime.textContent=remain;
      b.animate([
        {filter:"brightness(1)"},
        {filter:"brightness(.7) saturate(2)"},
        {filter:"brightness(1)"}
      ],{duration:320});
      return;
    }

    playFx(correctSound);
    b.disabled=true;
    flySlots.children[chosen].textContent=q.answers[i];
    chosen++;
    score++;
    flyScore.textContent=score;

    if(chosen===q.order.length){
      locked=true;
      clearInterval(timer);
      setTimeout(nextQuestion,850);
    }
  }

  function nextQuestion(){
    index++;
    if(index>=qs.length){
      stopMotion();
      showWinner(`${t("score")}：${score}`);
    }else{
      loadQuestion();
    }
  }

  flyNext.onclick=nextQuestion;
  loadQuestion();

  cleanupFns.push(stopMotion);
}

          <div class="cam-column">
            <div class="cam-circle">
              <video id="headVideo" autoplay muted playsinline></video>
            </div>
            <div id="headHint" class="head-hint">${t("headInstruction")}</div>
            <span class="pill">${t("score")}：<b id="headScore">0</b></span>
          </div>

          <button id="rightChoice" class="head-choice right"></button>
        </div>
      </div>
    </div>`;

  updateSoundButton();
  startBgm();

  const gameQuestion=document.getElementById("gameQuestion");
  const leftChoice=document.getElementById("leftChoice");
  const rightChoice=document.getElementById("rightChoice");
  const headVideo=document.getElementById("headVideo");
  const headHint=document.getElementById("headHint");
  const headScore=document.getElementById("headScore");

  let index=0;
  let score=0;
  let busy=false;
  let stream=null;
  let detector=null;
  let detectorTimer=null;
  let tiltCandidate=null;
  let tiltSince=0;
  let neutralReady=true;

  function loadQuestion(){
    busy=false;
    const q=qs[index];
    gameQuestion.textContent=q.question;
    leftChoice.textContent=`👈 ${q.answers[0]}`;
    rightChoice.textContent=`${q.answers[1]} 👉`;
  }

  function answer(side){
    if(busy)return;
    busy=true;

    const ok=side===qs[index].correct;
    if(ok){
      score++;
      headScore.textContent=score;
      playFx(correctSound);
      (side===0?leftChoice:rightChoice).style.filter="brightness(1.25)";
    }else{
      playFx(wrongSound);
      (side===0?leftChoice:rightChoice).style.filter="grayscale(.8)";
    }

    setTimeout(()=>{
      leftChoice.style.filter="";
      rightChoice.style.filter="";
      index++;

      if(index>=qs.length){
        try{stream?.getTracks().forEach(t=>t.stop())}catch{}
        showWinner(`${t("score")}：${score} / ${qs.length}`);
      }else{
        loadQuestion();
      }
    },650);
  }

  leftChoice.onclick=()=>answer(0);
  rightChoice.onclick=()=>answer(1);

  async function startCamera(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:"user"},
        audio:false
      });
      headVideo.srcObject=stream;

      if(!("FaceDetector" in window)){
        headHint.textContent="📷 Camera OK · 👆 "+t("click");
        return;
      }

      detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});

      detectorTimer=setInterval(async()=>{
        if(!detector||busy||headVideo.readyState<2)return;

        try{
          const faces=await detector.detect(headVideo);
          if(!faces.length){
            tiltCandidate=null;
            return;
          }

          const landmarks=faces[0].landmarks||[];
          const eyes=landmarks.filter(x=>/eye/i.test(x.type||""));
          if(eyes.length<2)return;

          const a=eyes[0].locations?.[0];
          const b=eyes[1].locations?.[0];
          if(!a||!b)return;

          let angle=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;

          /* 鏡像預覽，所以方向反轉後更符合畫面直覺 */
          angle=-angle;

          if(Math.abs(angle)<6){
            neutralReady=true;
            tiltCandidate=null;
            tiltSince=0;
            return;
          }

          if(!neutralReady)return;

          const side=angle>12?0:angle<-12?1:null;
          if(side==null){
            tiltCandidate=null;
            tiltSince=0;
            return;
          }

          if(tiltCandidate!==side){
            tiltCandidate=side;
            tiltSince=performance.now();
            return;
          }

          if(performance.now()-tiltSince>=500){
            neutralReady=false;
            tiltCandidate=null;
            tiltSince=0;
            answer(side);
          }
        }catch{}
      },120);

      cleanupFns.push(()=>clearInterval(detectorTimer));

    }catch{
      headHint.textContent="📷 Camera unavailable · 👆 "+t("click");
    }
  }

  if(inputMode==="camera")startCamera();
  else headHint.textContent="👆 "+t("click");

  loadQuestion();

  cleanupFns.push(()=>{
    clearInterval(detectorTimer);
    try{stream?.getTracks().forEach(t=>t.stop())}catch{}
  });
}

/* =========================================================
   遊戲 4：探險
========================================================= */
function startAdventure(){
  const qs=questions.filter(q=>q.question&&q.answers?.[0]&&q.answers?.[1]&&q.correct!=null);
  if(!qs.length){alert(t("invalid"));return}

  setupView.classList.add("hidden");
  gameView.classList.remove("hidden");

  gameView.innerHTML=`
    <div class="game-shell">
      ${gameHeader("")}

      <div class="game-main">
        <div class="adventure-map">
          <div id="adventurePath" class="adventure-path"></div>
        </div>
      </div>

      <div class="game-footer">
        <div class="dice-row">
          <span id="turnLabel" class="pill"></span>
          <div id="diceFace" class="dice-face">🎲</div>
          <button id="rollDiceBtn" class="btn primary" style="font-size:20px">
            🎲 ${t("roll")}
          </button>
        </div>
      </div>
    </div>`;

  updateSoundButton();
  startBgm();

  const path=document.getElementById("adventurePath");
  const diceFace=document.getElementById("diceFace");
  const rollDiceBtn=document.getElementById("rollDiceBtn");
  const turnLabel=document.getElementById("turnLabel");

  const TOTAL=30;
  const special={
    5:{icon:"⭐",move:1},
    9:{icon:"🌧️",move:-1},
    14:{icon:"🚀",move:2},
    19:{icon:"🕸️",move:-2},
    24:{icon:"🎁",move:1}
  };

  let redPos=0;
  let bluePos=0;
  let turn="red";
  let qIndex=0;
  let busy=false;
  let cells=[];

  function buildBoard(){
    path.innerHTML="";
    cells=[];
    for(let i=0;i<TOTAL;i++){
      const c=document.createElement("div");
      c.className="adventure-cell"+(special[i]?" special":"");
      c.innerHTML=i===TOTAL-1?"🏰":(special[i]?special[i].icon:(i+1));
      path.appendChild(c);
      cells.push(c);
    }
  }

  function renderTokens(){
    cells.forEach(c=>c.querySelectorAll(".token").forEach(x=>x.remove()));

    const rt=document.createElement("div");
    rt.className="token red-token";
    rt.textContent="🔴";
    cells[redPos].appendChild(rt);

    const bt=document.createElement("div");
    bt.className="token blue-token";
    bt.textContent="🔵";
    cells[bluePos].appendChild(bt);

    turnLabel.textContent=`${t("turn")}：${turn==="red"?t("red"):t("blue")}`;
  }

  function roll(){
    if(busy)return;
    busy=true;

    const oldPos=turn==="red"?redPos:bluePos;
    const n=Math.floor(Math.random()*6)+1;
    diceFace.textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][n-1];

    let moved=0;
    const moveTimer=setInterval(()=>{
      if(moved>=n){
        clearInterval(moveTimer);
        askQuestion(oldPos);
        return;
      }

      if(turn==="red"){
        if(redPos<TOTAL-1)redPos++;
      }else{
        if(bluePos<TOTAL-1)bluePos++;
      }

      moved++;
      renderTokens();

      const p=turn==="red"?redPos:bluePos;
      if(p>=TOTAL-1){
        clearInterval(moveTimer);
        showWinner(`${turn==="red"?t("red"):t("blue")} ${t("winner")}`);
      }
    },250);

    cleanupFns.push(()=>clearInterval(moveTimer));
  }

  function askQuestion(oldPos){
    const q=qs[qIndex%qs.length];
    qIndex++;

    modalCard.innerHTML=`
      <h2>${esc(q.question)}</h2>
      <div id="advOptions" class="option-grid"></div>`;
    modal.classList.add("show");

    const box=document.getElementById("advOptions");

    q.answers.slice(0,4).forEach((a,i)=>{
      if(!a)return;
      const b=document.createElement("button");
      b.className="option-btn";
      b.textContent=`${String.fromCharCode(65+i)}. ${a}`;

      b.onclick=()=>{
        [...box.children].forEach(x=>x.disabled=true);

        if(i===q.correct){
          playFx(correctSound);
          b.classList.add("good");

          setTimeout(()=>{
            modal.classList.remove("show");

            let p=turn==="red"?redPos:bluePos;
            if(special[p]){
              p=Math.max(0,Math.min(TOTAL-1,p+special[p].move));
              if(turn==="red")redPos=p;
              else bluePos=p;
              renderTokens();
            }

            if(p>=TOTAL-1){
              showWinner(`${turn==="red"?t("red"):t("blue")} ${t("winner")}`);
              return;
            }

            turn=turn==="red"?"blue":"red";
            busy=false;
            renderTokens();
          },650);

        }else{
          playFx(wrongSound);
          b.classList.add("bad");

          if(turn==="red")redPos=oldPos;
          else bluePos=oldPos;

          setTimeout(()=>{
            modal.classList.remove("show");
            turn=turn==="red"?"blue":"red";
            busy=false;
            renderTokens();
          },700);
        }
      };
      box.appendChild(b);
    });
  }

  buildBoard();
  renderTokens();
  rollDiceBtn.onclick=roll;
}

/* =========================================================
   啟動
========================================================= */
renderLangSelect(lobbyLang);
renderLangSelect(setupLang);

questions=loadSavedQuestions();

loadSheetBtn.onclick=()=>loadSheetFromUI(
  sheetUrl.value.trim(),
  sheetName.value.trim()
);

bankFile.onchange=async e=>{
  const f=e.target.files[0];
  if(!f)return;

  showStatus("info",t("loading"));

  try{
    let rows;
    if(f.name.toLowerCase().endsWith(".csv")){
      rows=parseCSV(await f.text());
    }else{
      const wb=XLSX.read(await f.arrayBuffer());
      rows=XLSX.utils.sheet_to_json(
        wb.Sheets[wb.SheetNames[0]],
        {header:1,defval:""}
      );
    }

    const imported=rowsToQuestions(rows);
    if(!imported.length)throw new Error();

    questions=imported;
    saveQuestions();
    renderQuestionEditor();
    showStatus("ok",`${t("loaded")}：${questions.length}`);
  }catch{
    showStatus("err",t("invalid"));
  }

  e.target.value="";
};

addQuestionBtn.onclick=()=>{
  const max=selectedGame==="fly"?12:4;
  questions.push({
    question:"",
    answers:Array(max).fill(""),
    correct:selectedGame==="fly"?null:0,
    order:selectedGame==="fly"?[0,1]:null
  });
  saveQuestions();
  renderQuestionEditor();
};

clearQuestionsBtn.onclick=()=>{
  if(confirm(t("clear")+"?")){
    questions=[];
    saveQuestions();
    renderQuestionEditor();
  }
};

downloadTemplateBtn.onclick=downloadTemplate;

startGameBtn.onclick=()=>{
  if(!questions.length){
    alert(t("needBank"));
    return;
  }

  /* 在真正的使用者點擊事件中直接啟動 BGM，避免 Chrome / Edge 阻擋 */
  if(soundEnabled){
    try{
      bgm.currentTime=0;
      bgm.play().catch(()=>{});
    }catch{}
  }

  if(selectedGame==="tug")startTug();
  else if(selectedGame==="fly")startFly();
  else if(selectedGame==="head")startHead();
  else if(selectedGame==="adventure")startAdventure();
};

syncLanguage();
</script>
