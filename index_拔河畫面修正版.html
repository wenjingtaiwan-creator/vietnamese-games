:root{--brand:#6e56ef;--red:#ef4a5a;--blue:#2f8fe8;--green:#21ad67;--ink:#243149;--muted:#738096;--shadow:0 12px 32px rgba(36,49,73,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}
body{background:linear-gradient(135deg,#effaf2,#fffbdc,#fff0f3)}.hidden{display:none!important}.brand{font-weight:1000}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #e6eaf0}.topinner{max-width:1200px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.container{max-width:1200px;margin:auto;padding:24px 18px 60px}.hero{text-align:center;padding:28px 10px 12px}.hero h1{font-size:clamp(36px,5vw,62px);margin:0 0 8px}.hero p{color:var(--muted);font-size:18px}.lang,.input{border:2px solid #dfe4ed;border-radius:14px;background:white;padding:11px 13px;outline:none}.lang:focus,.input:focus{border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,.section{background:white;border-radius:24px;box-shadow:var(--shadow);padding:22px}.gamecard{min-height:230px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s;border:2px solid transparent}.gamecard:hover{transform:translateY(-4px);border-color:#d7d0ff}.icon{font-size:56px}.gamecard h2{font-size:28px;margin:8px 0}.gamecard p,.note{color:var(--muted);line-height:1.7}.btn{border:0;border-radius:999px;padding:12px 19px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:linear-gradient(135deg,var(--brand),#8a64ff);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.ghost{background:#edf1f6;color:#38475d}.danger{background:var(--red);color:#fff}.small{padding:8px 12px;font-size:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:220px}.section{margin:18px 0}.section h2{margin:0 0 14px}.status{display:none;padding:11px 14px;border-radius:13px;margin-top:12px;font-weight:800}.status.show{display:block}.status.ok{background:#e1f8e9;color:#18703e}.status.err{background:#ffe4e7;color:#b42a36}.status.info{background:#fff3c4;color:#765e00}.recent{display:grid;gap:9px}.recentitem{display:flex;align-items:center;gap:8px;background:#f6f8fb;padding:10px;border-radius:14px}.recentitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qcard{border:2px solid #edf0f4;border-radius:18px;padding:15px;margin:12px 0}.answersedit{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.answeredit{display:flex;align-items:center;gap:7px}.answeredit .input{width:100%}
#gameView{height:100vh;overflow:hidden;background:#101827}.gamehdr{height:86px;background:white;display:flex;align-items:center;gap:12px;padding:10px 16px}.gamehdr .center{flex:1;text-align:center}.gamehdr .title{font-weight:1000}.gamehdr .question{font-weight:1000;font-size:clamp(20px,2.7vw,40px)}.gamemain{height:calc(100vh - 172px);position:relative;overflow:hidden}.gameftr{height:86px;background:white;padding:10px 16px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#edf1f6;padding:8px 12px;font-weight:900}.modal{position:fixed;inset:0;background:rgba(8,15,26,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:24px;padding:26px;width:min(650px,95vw);text-align:center;box-shadow:var(--shadow)}
/* tug */.arena{height:54%;background:url('assets/background.png') center/cover;position:relative;overflow:hidden}.arena:after{content:"";position:absolute;left:50%;bottom:0;height:55%;border-left:5px solid rgba(255,255,255,.9)}.tugwrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}.tugimg{width:96%;max-height:92%;object-fit:contain;transition:transform .4s}.tag{position:absolute;bottom:10px;color:#fff;padding:8px 18px;border-radius:999px;font-weight:1000;z-index:4}.rtag{left:20px;background:var(--red)}.btag{right:20px;background:var(--blue)}.twoteams{height:46%;display:grid;grid-template-columns:1fr 1fr;background:#fff}.team{padding:9px;position:relative;background:#fff}.team:first-child{border-right:2px solid #e4e8ee}.team h3{text-align:center;margin:0 0 7px}.ansgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ans{min-height:50px;border:3px solid #dce3ec;border-radius:14px;background:#fff;font-weight:900;padding:8px}.team.red .ans{border-color:#f3a1aa}.team.blue .ans{border-color:#9dc8f2}.ans.good{background:#dff8e7;border-color:#34af63}.ans.bad{background:#ffe2e6;border-color:#ef5965}.penalty{position:absolute;inset:0;background:rgba(20,28,40,.92);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font-weight:1000;z-index:5}.penalty.show{display:flex}.dualhead{position:absolute;top:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;background:#fff}.dualhead>div{padding:8px;text-align:center;font-weight:1000}.dualhead>div:first-child{border-right:2px solid #eee}

@media(max-width:800px){.grid{grid-template-columns:1fr}.answersedit{grid-template-columns:1fr}.choicearea{grid-template-columns:1fr 1fr;padding:12px}.camwrap{grid-column:1/-1;grid-row:1}.cam{width:145px;height:145px}.choice{min-height:150px}.path{grid-template-columns:repeat(5,1fr)}}

</div>
<div id="gameView" class="hidden"></div>
<div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div>

function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);if(row.some(x=>String(x).trim()))rows.push(row);row=[];f=''}else f+=c}row.push(f);if(row.some(x=>String(x).trim()))rows.push(row);return rows}
function rowsToQ(rows){if(!rows||rows.length<2)return[];const n=s=>String(s??'').trim().toLowerCase().replace(/\s/g,'');const h=rows[0].map(n);const idx=a=>{for(const x of a){const i=h.indexOf(n(x));if(i>=0)return i}return-1};const qi=idx(['題目','question','問題','prompt']),ai=idx(['a','選項a','答案a','left','左']),bi=idx(['b','選項b','答案b','right','右']),ci=idx(['c','選項c','答案c']),di=idx(['d','選項d','答案d']),ri=idx(['正確答案','答案','correct','correctanswer','order','順序']);if(qi<0||ai<0||bi<0||ri<0)return[];const out=[];for(let r=1;r<rows.length;r++){const row=rows[r],q=String(row[qi]??'').trim();if(!q)continue;const answers=[ai,bi,ci,di].map(i=>i>=0?String(row[i]??'').trim():'');const raw=String(row[ri]??'').trim().toUpperCase();const map={A:0,B:1,C:2,D:3,'1':0,'2':1,'3':2,'4':3};let correct=null,order=null;if(map[raw]!==undefined)correct=map[raw];else{const tok=raw.split(/[,\s>→\-]+/).filter(Boolean);if(tok.length>1&&tok.every(x=>map[x]!==undefined))order=tok.map(x=>map[x])}out.push({question:q,answers,correct,order})}return out}

function sheetInfo(url){const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)return null;const gid=(url.match(/[?#&]gid=(\d+)/)||[])[1]||'0';return{id:m[1],gid}}

function startTug(){let qs=questions.filter(q=>q.question&&q.answers?.[0]&&q.answers?.[1]&&q.correct!=null);if(!qs.length){alert(t('invalid'));return}const mode=document.querySelector('input[name=mode]:checked')?.value||'classic';showGame(`${hdr()}<div class="gamemain"><div id="dualH" class="dualhead ${mode==='dual'?'':'hidden'}"><div id="rq"></div><div id="bq"></div></div><div class="arena"><div class="tugwrap"><img id="timg" class="tugimg" src="assets/tug-war.png"></div><div class="tag rtag" id="rt"></div><div class="tag btag" id="bt"></div></div><div class="twoteams"><div class="team red"><h3 id="rtitle"></h3><div id="ra" class="ansgrid"></div><div id="rp" class="penalty"><div>${t('pause')}</div><div id="rpn" style="font-size:64px">3</div></div></div><div class="team blue"><h3 id="btitle"></h3><div id="ba" class="ansgrid"></div><div id="bp" class="penalty"><div>${t('pause')}</div><div id="bpn" style="font-size:64px">3</div></div></div></div></div><div class="gameftr"></div>`);rt.textContent='🔴 '+t('red');bt.textContent=t('blue')+' 🔵';rtitle.textContent='🔴 '+t('red');btitle.textContent='🔵 '+t('blue');let rope=0,idx=0,rA=null,bA=null,rTime=0,bTime=0,start=0,ended=false,ro=[],bo=[],ri=0,bi=0,rpen=false,bpen=false;const make=(box,q,cb)=>{box.innerHTML='';q.answers.forEach((a,i)=>{if(!a)return;const b=document.createElement('button');b.className='ans';b.textContent='ABCD'[i]+'. '+a;b.onclick=()=>cb(i,b);box.appendChild(b)})};const move=d=>{rope+=d;timg.style.transform=`translateX(${rope*2.8}vw)`;if(Math.abs(rope)>=5){ended=true;setTimeout(()=>win((rope<0?t('red'):t('blue'))+' '+t('winner')),350);return true}return false};if(mode==='classic'){const load=()=>{if(ended)return;rA=bA=null;const q=qs[idx];gameQ.textContent=q.question;start=performance.now();make(ra,q,(i,b)=>choose('r',i,b));make(ba,q,(i,b)=>choose('b',i,b))};const choose=(team,i,b)=>{if(ended||(team==='r'?rA:bA)!=null)return;const tm=performance.now()-start;b.classList.add('good');if(team==='r'){rA=i;rTime=tm;[...ra.children].forEach(x=>x.disabled=true)}else{bA=i;bTime=tm;[...ba.children].forEach(x=>x.disabled=true)}if(rA!=null&&bA!=null)finish()};const finish=()=>{const q=qs[idx],rc=rA===q.correct,bc=bA===q.correct;if(rc||bc)playFx(correctSound);else playFx(wrongSound);[ra,ba].forEach(box=>[...box.children].forEach((x,i)=>{x.classList.toggle('good',i===q.correct);if(i!==q.correct&&x.disabled)x.classList.add('bad')}));if(rc&&!bc){if(move(-1))return}else if(bc&&!rc){if(move(1))return}else if(rc&&bc&&Math.abs(rTime-bTime)>=50){if(move(rTime<bTime?-1:1))return}const to=setTimeout(()=>{idx=(idx+1)%qs.length;load()},1300);cleanupFns.push(()=>clearTimeout(to))};load()}else{ro=shuffle(qs.map((_,i)=>i));bo=shuffle(qs.map((_,i)=>i));if(qs.length>1&&ro[0]===bo[0])[bo[0],bo[1]]=[bo[1],bo[0]];const qi=t=>t==='r'?ro[ri]:bo[bi];const load=t=>{const q=qs[qi(t)];if(t==='r'){rq.textContent=q.question;make(ra,q,(i,b)=>choose('r',i,b))}else{bq.textContent=q.question;make(ba,q,(i,b)=>choose('b',i,b))}};const penalty=t=>{let n=3;if(t==='r'){rpen=true;rp.classList.add('show');rpn.textContent=n}else{bpen=true;bp.classList.add('show');bpn.textContent=n}const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);if(t==='r'){rpen=false;rp.classList.remove('show');[...ra.children].forEach(x=>{x.disabled=false;x.classList.remove('bad')})}else{bpen=false;bp.classList.remove('show');[...ba.children].forEach(x=>{x.disabled=false;x.classList.remove('bad')})}}else(t==='r'?rpn:bpn).textContent=n},1000);cleanupFns.push(()=>clearInterval(iv))};const choose=(t0,i,b)=>{if(ended||(t0==='r'?rpen:bpen))return;const q=qs[qi(t0)],box=t0==='r'?ra:ba;if(i===q.correct){playFx(correctSound);b.classList.add('good');[...box.children].forEach(x=>x.disabled=true);if(move(t0==='r'?-1:1))return;const to=setTimeout(()=>{if(t0==='r'){ri++;if(ri>=ro.length){ro=shuffle(qs.map((_,i)=>i));ri=0}}else{bi++;if(bi>=bo.length){bo=shuffle(qs.map((_,i)=>i));bi=0}}load(t0)},380);cleanupFns.push(()=>clearTimeout(to))}else{playFx(wrongSou function startFly(){let qs=questions.filter(q=>q.question&&q.order?.length>=2);if(!qs.length){alert('會飛的字需要在「正確答案」填順序，例如 B,D,A,C');return}showGame(`${hdr()}<div class="gamemain"><div id="field" class="flyfield"></div></div><div class="gameftr"><div id="slots" class="slots"></div></div>`);let idx=0,pts=0,items=[],raf=null;const palette=['#673ad7','#e44c86','#24b6c7','#db8b2f','#3988df','#22b98a'];const load=()=>{cancelAnimationFrame(raf);field.innerHTML='';slots.innerHTML='';items=[];const q=qs[idx];gameQ.textContent=q.question;q.order.forEach(()=>{const s=document.createElement('div');s.className='slot';slots.appendChild(s)});let chosen=0;q.answers.forEach((txt,i)=>{if(!txt)return;const b=document.createElement('button');b.className='word';b.textContent=txt;b.style.background=palette[i%palette.length];field.appendChild(b);items.push({el:b,x:Math.random()*70+5,y:Math.random()*55+5,vx:(Math.random()*.18+.06)*(Math.random()<.5?-1:1),vy:(Math.random()*.14+.04)*(Math.random()<.5?-1:1)});b.onclick=()=>{if(i!==q.order[chosen]){playFx(wrongSound);b.animate([{filter:'brightness(1)'},{filter:'brightness(.4)'},{filter:'brightness(1)'}],{duration:300});return}b.disabled=true;b.style.opacity=.35;slots.children[chosen].textContent=q.answers[i];chosen++;pts++;if(chosen===q.order.length){playFx(correctSound);const to=setTimeout(()=>{idx++;if(idx>=qs.length){cancelAnimationFrame(raf);win(t('score')+': '+pts)}else load()},650);cleanupFns.push(()=>clearTimeout(to))}}});const anim=()=>{const w=field.clientWidth,h=field.clientHeight;for(const o of items){o.x+=o.vx;o.y+=o.vy;const ew=o.el.offsetWidth,eh=o.el.offsetHeight;if(o.x<0||o.x>w-ew){o.vx*=-1;o.x=Math.max(0,Math.min(o.x,w-ew))}if(o.y<0||o.y>h-eh){o.vy*=-1;o.y=Math.max(0,Math.min(o.y,h-eh))}o.el.style.transform=`translate(${o.x}px,${o.y}px)`}raf=requestAnimationFrame(anim)};anim();cleanupFns.push(()=>cancelAnimationFrame(raf))};load()}
function startHead(){let qs=questions.filter(q=>q.question&&q.answers?.[0]&&q.answers?.[1]&&(q.correct===0||q.correct===1));if(!qs.length){alert(t('invalid'));return}const inputMode=document.querySelector('input[name=inputMode]:checked')?.value||'click';showGame(`${hdr()}<div class="gamemain"><div class="choicearea"><button id="leftC" class="choice leftchoice"></button><div class="camwrap"><div class="cam"><video id="video" autoplay muted playsinline></video></div><b id="hint">${t('headInstruction')}</b></div><button id="rightC" class="choice rightchoice"></button></div></div><div class="gameftr"><div class="row" style="justify-content:center"><span class="pill">${t('score')}: <b id="score">0</b></span></div></div>`);let idx=0,pts=0,busy=false,stream=null,detector=null,last=0;const load=()=>{busy=false;const q=qs[idx];gameQ.textContent=q.question;leftC.textContent='👈 '+q.answers[0];rightC.textContent=q.answers[1]+' 👉';leftC.onclick=()=>answer(0);rightC.onclick=()=>answer(1)};const answer=c=>{if(busy)return;busy=true;const ok=c===qs[idx].correct;if(ok){playFx(correctSound);pts++;score.textContent=pts}else{playFx(wrongSound)}const b=c===0?leftC:rightC;b.style.filter=ok?'brightness(1.25)':'grayscale(.85)';const to=setTimeout(()=>{b.style.filter='';idx++;if(idx>=qs.length){stream?.getTracks().forEach(x=>x.stop());win(t('score')+': '+pts+' / '+qs.length)}else load()},650);cleanupFns.push(()=>clearTimeout(to))};load();if(inputMode==='camera'){(async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;cleanupFns.push(()=>stream?.getTracks().forEach(x=>x.stop()));if(!('FaceDetector' in window)){hint.textContent=t('headInstruction')+' · '+t('click');return}detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});const iv=setInterval(async()=>{if(busy||video.readyState<2)return;try{const faces=await detector.detect(video);if(!faces.length)return;const lm=faces[0].landmarks||[],eyes=lm.filter(x=>/eye/i.test(x.type||''));if(eyes.length<2)return;const a=eyes[0].locations?.[0],b=eyes[1].locations?.[0];if(!a||!b)return;const angle=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,now=Date.now();if(angle>12&&now-last>900){last=now;answer(0)}else if(angle<-12&&now-last>900){last=now;answer(1)}}catch{}},180);cleanupFns.push(()=>clearInterval(iv))}catch{hint.textContent=t('headInstruction')+' · '+t('click')}})()}}
function startAdv(){let qs=questions.filter(q=>q.question&&q.answers?.[0]&&q.answers?.[1]&&q.correct!=null);if(!qs.length){alert(t('invalid'));return}showGame(`${hdr()}<div class="gamemain"><div class="map"><div id="path" class="path"></div></div></div><div class="gameftr"><div class="row" style="justify-content:center"><div id="dice" style="font-size:50px">🎲</div><button id="rollB" class="btn primary">🎲 ${t('roll')}</button></div></div>`);let pos=0,qidx=0,busy=false,total=32,cells=[];for(let i=0;i<total;i++){const c=document.createElement('div');c.className='cell'+([5,11,18,25].includes(i)?' special':'');c.textContent=i===total-1?'🏰':([5,11,18,25].includes(i)?'⭐':i+1);path.appendChild(c);cells.push(c)}const upd=()=>{cells.forEach(c=>c.querySelector('.player')?.remove());const p=document.createElement('div');p.className='player';p.textContent='🧭';cells[pos].appendChild(p);gameQ.textContent=`${pos+1} / ${total}`};const ask=()=>{const q=qs[qidx++%qs.length];modalBox.innerHTML=`<h2>${esc(q.question)}</h2><div class="opts" id="mopts"></div>`;q.answers.forEach((a,i)=>{if(!a)return;const b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+a;b.onclick=()=>{if(i===q.correct){playFx(correctSound);b.style.background='#dff8e7'}else{playFx(wrongSound);b.style.background='#ffe2e6';pos=Math.max(0,pos-1);upd()}const to=setTimeout(()=>{modal.classList.remove('show');busy=false},550);cleanupFns.push(()=>clearTimeout(to))};mopts.appendChild(b)});modal.classList.add('show')};rollB.onclick=()=>{if(busy)return;busy=true;const n=Math.floor(Math.random()*6)+1;dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][n-1];let s=0;const iv=setInterval(()=>{if(s>=n||pos>=total-1){clearInterval(iv);if(pos>=total-1){win(t('winner'));return}ask();return}pos++;s++;upd()},250);cleanupFns.push(()=>clearInterval(iv))};upd()}
